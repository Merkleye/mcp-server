# Tools AND tasks live here, deliberately. CI runs `mise run <task>` too, so
# there is exactly one definition of what "check" means — no Makefile drifting
# from a workflow file. Task names match merkleye's Makefile targets so muscle
# memory carries between the two repos.

[tools]
# Kept in sync by hand with go.mod's `go` directive, and with merkleye's
# mise.toml — this repo generates its API client from merkleye's spec, so a
# toolchain split between them shows up as a generation failure.
go = "1.27.1"
golangci-lint = "2.13.2"
# The client generator and the vulnerability scanner are go.mod `tool`
# dependencies, not mise tools: the container build has no mise, and two pins
# for one binary is one pin too many. `go tool` resolves both from go.mod, so
# mise, CI and the image all run the same version.
#
# The MCP Inspector is deliberately absent. It was an npm-backend tool nothing
# in this repo actually invokes, and installing it failed CI outright on a
# supply-chain trust downgrade in a transitive dependency (tailwind-merge).
# Excluding a package from mise's trust policy to install a tool no task runs
# would be weakening a security control for nothing. Run it ad hoc instead:
#   npx @modelcontextprotocol/inspector

[tasks.hooks]
description = "Point git at .githooks/"
run = "git config core.hooksPath .githooks"

[tasks.spec]
description = "Fetch merkleye's OpenAPI spec for the pinned commit (never stored in this repo)"
run = "./scripts/fetch-spec.sh"

[tasks.generate]
description = "Regenerate the Merkleye API client from the pinned upstream spec"
depends = ["hooks", "spec"]
run = """
python3 scripts/prepare-spec.py
go tool oapi-codegen -config internal/merkleyeapi/codegen.yaml api/openapi.codegen.yaml
"""

[tasks.build]
description = "Build the server"
depends = ["generate"]
run = "CGO_ENABLED=0 go build -trimpath -o merkleye-mcp ./cmd/merkleye-mcp"

[tasks.test]
description = "Run tests"
depends = ["generate"]
run = "go test -race ./..."

[tasks.vet]
description = "go vet"
depends = ["generate"]
run = "go vet ./..."

[tasks.fmt]
description = "Format (mutating)"
run = "gofmt -l -w ."

[tasks.fmt-check]
description = "Report unformatted files (non-mutating; for CI)"
run = '''
out=$(gofmt -l . | grep -v '^internal/merkleyeapi/client.gen.go$' || true)
if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
'''

[tasks.lint]
description = "Run golangci-lint"
depends = ["generate"]
run = "golangci-lint run"

[tasks.govulncheck]
description = "Check for known vulnerabilities"
depends = ["generate"]
run = "go tool govulncheck ./..."

[tasks.check]
description = "Everything CI runs"
# `spec` is not listed: every task below that needs the contract already
# depends on `generate`, which fetches it.
depends = ["fmt-check", "vet", "lint", "govulncheck", "test"]
