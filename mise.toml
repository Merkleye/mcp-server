# Tools AND tasks live here, deliberately. CI runs `mise run <task>` too, so
# there is exactly one definition of what "check" means — no Makefile drifting
# from a workflow file. Task names match merkleye's Makefile targets so muscle
# memory carries between the two repos.

[tools]
# Kept in sync by hand with go.mod's `go` directive, and with merkleye's
# mise.toml — this repo generates its API client from merkleye's spec, so a
# toolchain split between them shows up as a generation failure.
go = "1.27.1"
golangci-lint = "2.13.2"
# The client generator. Pinned here rather than as a go.mod tool dependency
# because it is only ever run by `mise run generate`, never imported.
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.0"
# Conformance: drives the MCP Inspector against a running server.
"npm:@modelcontextprotocol/inspector" = "0.17.2"

[tasks.hooks]
description = "Point git at .githooks/"
run = "git config core.hooksPath .githooks"

[tasks.generate]
description = "Regenerate the Merkleye API client from api/openapi.yaml"
depends = ["hooks"]
run = """
python3 scripts/prepare-spec.py
oapi-codegen -config internal/merkleyeapi/codegen.yaml api/openapi.codegen.yaml
"""

[tasks.build]
description = "Build the server"
depends = ["generate"]
run = "CGO_ENABLED=0 go build -trimpath -o merkleye-mcp ./cmd/merkleye-mcp"

[tasks.test]
description = "Run tests"
depends = ["generate"]
run = "go test -race ./..."

[tasks.vet]
description = "go vet"
depends = ["generate"]
run = "go vet ./..."

[tasks.fmt]
description = "Format (mutating)"
run = "gofmt -l -w ."

[tasks.fmt-check]
description = "Report unformatted files (non-mutating; for CI)"
run = '''
out=$(gofmt -l . | grep -v '^internal/merkleyeapi/client.gen.go$' || true)
if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
'''

[tasks.lint]
description = "Run golangci-lint"
depends = ["generate"]
run = "golangci-lint run"

[tasks.govulncheck]
description = "Check for known vulnerabilities"
depends = ["generate"]
run = "go tool govulncheck ./..."

[tasks.spec]
description = "Verify the vendored spec matches upstream and every operation is named"
run = "./scripts/check-spec-drift.sh"

[tasks.check]
description = "Everything CI runs"
depends = ["fmt-check", "vet", "lint", "govulncheck", "test", "spec"]
