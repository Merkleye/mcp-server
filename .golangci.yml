version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    paths:
      # Generated by `mise run generate` from api/openapi.yaml — never
      # hand-edited, so it is not worth linting.
      - internal/merkleyeapi/client\.gen\.go

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/merkleyeapi/client\.gen\.go
