            type: string
            # An empty value means "no filter", which is how every
            # other optional parameter here reads it — so the empty
            # string has to be as legal as a timestamp.
            anyOf:
              - { format: date-time }
              - { maxLength: 0 }
        - name: expires_after
          in: query
          description: Inclusive lower bound on the certificate's `not_after`, RFC 3339.
          schema:
            type: string
            # An empty value means "no filter", which is how every
            # other optional parameter here reads it — so the empty
            # string has to be as legal as a timestamp.
            anyOf:
              - { format: date-time }
              - { maxLength: 0 }
        - name: expires_before
          in: query
          description: Inclusive upper bound on the certificate's `not_after`, RFC 3339.
          schema:
            type: string
            # An empty value means "no filter", which is how every
            # other optional parameter here reads it — so the empty
            # string has to be as legal as a timestamp.
            anyOf:
              - { format: date-time }
              - { maxLength: 0 }
        - name: max_validity_days
          in: query
          description: |
            Restrict to matches whose certificate's lifetime (`not_after` -
            `not_before`) exceeds this many days — a policy-violation filter
            independent of any one domain's configured
            `expected_issuers`/`max_validity_days`. Must be a positive
            integer.
          schema:
            # An empty value means "no filter" — see the note on the
            # date filters. The integer form is what a caller sends.
            anyOf:
              - { type: integer, minimum: 1, maximum: 9223372036854775807 }
              - { type: string, maxLength: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/Match" }
                  next_cursor: { type: [string, "null"] }
                  next: { type: [string, "null"] }
                  total:
                    type: integer
                    description: |
                      Row count matching the current filters, independent of
                      cursor/limit/page and of merge_tbs_sha256/
                      collapse_cert_sans — see GET /domains/{id}/matches'
                      total.
                  total_merged:
                    type: integer
                    description: |
                      Present whenever collapse_cert_sans and/or
                      merge_tbs_sha256 collapsed the page — which is by
                      default — see GET /domains/{id}/matches' total_merged.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/matches/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [findings]
      operationId: getMatch
      summary: Match detail, with risk breakdown and enrichment
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/matches/{id}/rescore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [findings]
      operationId: rescoreMatch
      summary: Backfill risk_score/risk_components for one match
      description: |
        Recomputes and returns this match with a refreshed `risk_score`/
        `risk_components`, from its own already-stored classification — see
        `POST /domains/{id}/matches/rescore` for the same operation scoped to
        a whole domain. Only exact matches can be rescored this way: variant
        matches' signals depend on enrichment data that isn't persisted, so
        this 404s for a variant match id, the same as for one that doesn't
        exist at all.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/matches/{id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [findings]
      operationId: acknowledgeMatch
      summary: Acknowledge a match
      description: |
        The human "seen this, it's handled" triage action — sets
        acknowledged_at/acknowledged_by. Distinct from
        POST /matches/{id}/allowlist, which prevents the same lookalike from
        ever matching again; this just marks the one row reviewed. Applies
        to exact and variant matches alike, unlike rescoring.
      responses:
        "204": { description: Acknowledged }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/matches/stream:
    get:
      tags: [findings]
      operationId: streamMatches
      summary: Live match feed (SSE)
      description: |
        Server-Sent Events: one `event: match` per newly-persisted match,
        across every watched domain, as internal/pipeline classifies it —
        the live counterpart to GET /matches. Each event's `data` line is a
        full Match, the identical shape GET /matches/{id} returns, so a
        client never has to reconcile two representations of the same
        resource. Nothing is replayed on connect — only matches persisted
        after this request opens are delivered, because there is no single
        "current state" for a global match feed to replay.

        A connection that falls behind (buffer exhausted between events)
        simply misses events rather than blocking ingestion — reconnect and
        resume from GET /matches with a cursor to fill any gap.

        This is live: this describes real, running SSE delivery, not a
        stub. 501s under one precondition — no live match feed is wired up
        for this deployment (`internal/matchfeed`, published to by
        `internal/pipeline` on every newly-persisted match) — the same way
        POST .../variants/regenerate 501s when variant generation isn't
        configured.
      responses:
        "200":
          description: |
            text/event-stream of Match events. Each message is
            `event: match\ndata: <Match JSON>\n\n`.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Match" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/allowlist:
    get:
      tags: [allowlist]
      operationId: listAllowlist
      summary: List allowlisted lookalikes
      description: |
        Unpaginated: the set is small and human-curated, same as GET
        /plugins — next_cursor and next are always null rather than
        omitted or growing real pagination a bounded list doesn't need (see
        DESIGN "Every resource carries _self...").
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowlist:
                    type: array
                    items: { $ref: "#/components/schemas/AllowlistEntry" }
                  next_cursor: { type: "null" }
                  next: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [allowlist]
      operationId: createAllowlistEntry
      summary: Add an allowlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowlistEntryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [allowlist]
      operationId: getAllowlistEntry
      summary: Allowlist entry detail
      description: The target of every AllowlistEntry's `_self` link.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [allowlist]
      operationId: deleteAllowlistEntry
      summary: Remove an allowlist entry
      description: Permanent — an allowlist entry carries no downstream history the way a domain does, so there's no soft-delete step here.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: List notification channels
      description: |
        Unpaginated: the set is small and operator-curated, same as GET
        /allowlist. Every channel's `url` is redacted — see
        NotificationChannel's own description for why.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification_channels:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationChannel" }
                  next_cursor: { type: "null" }
                  next: { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: Create a notification channel
      description: |
        The channel's `url` carries its delivery secret (a Slack/Discord bot
        token, SMTP credentials, or a webhook token query param — see
        internal/notify/sender.go's scheme routing) and is encrypted at the
        field level (internal/dbcrypt) before it reaches Postgres — never
        returned by any read, including this response. See
        docs/THREAT-MODEL.md's "Notification channels are egress". See github.com/nikoksr/notify

        The channel is verified before it is stored: the server delivers a
        real message through the supplied `url` and persists nothing unless
        it arrives, so no channel exists here that has never worked. A
        channel discovered broken during an incident is the failure this
        prevents, and there is no override — an operator who cannot deliver
        to a URL now could not deliver an alert to it either.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "502": { $ref: "#/components/responses/NotificationChannelTestFailed" }
        "503": { $ref: "#/components/responses/EncryptionKeyNotConfigured" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notification-channels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [notifications]
      operationId: getNotificationChannel
      summary: Notification channel detail
      description: The target of every NotificationChannel's `_self` link.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: Update a notification channel
      description: |
        Every field optional — an absent field leaves it unchanged. Omitting
        `url` leaves the encrypted secret untouched, so `min_severity` or
        `enabled` can be retuned without re-supplying the webhook URL.

        A patch that carries `url` is a credential write and is verified
        exactly like a create: the server delivers a message through the new
        URL first and applies nothing unless it arrives. A patch without one
        changes body context only and sends nothing — re-testing a URL nobody
        touched would just be noise in someone's alert channel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "502": { $ref: "#/components/responses/NotificationChannelTestFailed" }
        "503": { $ref: "#/components/responses/EncryptionKeyNotConfigured" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: Remove a notification channel
      description: Permanent — a channel carries no downstream history the way a domain does, so there's no soft-delete step here.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/settings/notifications:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: Get alert-delivery settings
      description: |
        config.yaml's old `notifications.dedup_window/rate_limit/retry`, now
        Postgres-owned. See DESIGN §13.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [notifications]
      operationId: replaceNotificationSettings
      summary: Replace alert-delivery settings
      description: Takes effect on the running notify.Engine immediately — no restart required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/plugins:
    get:
      tags: [ops]
      operationId: listPlugins
      summary: Ingestion plugin status
      description: |
        Per-plugin lag and last success, plus the ingestion watchdog state and
        watch-set sizes. This is what the UI status strip reads for operators
        without Prometheus.

        A plugin that fans out across multiple upstream logs (certspotter)
        also carries a lightweight `logs` array here — identity and last
        checkpoint only. Full per-log detail (backlog, error history) is
        deliberately kept off this endpoint so a dashboard poll doesn't pay
        for every log's history on every plugin, every refresh; fetch
        GET /plugins/{id} for that.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/plugins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Plugin name, e.g. `certspotter`.
        example: certstream
    get:
      tags: [ops]
      operationId: getPlugin
      summary: Detailed plugin status, including full per-log checkpoint data
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/plugins/{id}/logs/{logId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Plugin name, e.g. `certspotter`.
      - name: logId
        in: path
        required: true
        schema: { type: string }
        description: A log's `log_id`, as returned in `plugins[].logs[]` or `PluginDetail.logs[]`.
    get:
      tags: [ops]
      operationId: getPluginLog
      summary: One log's full checkpoint detail
      description: |
        The target of each log entry's `_self` link — the same object shape
        as one item of `PluginDetail.logs[]`, fetched directly rather than by
        re-reading the whole plugin. 404s if the plugin doesn't exist, has no
        per-log concept, or never reported this log ID.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginLogDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/plugins/{id}/config:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Plugin name, e.g. `certstream`.
        example: certstream
    get:
      tags: [ops]
      operationId: getPluginConfig
      summary: Admin-set DB override for a plugin's connection settings
      description: |
        Only certstream implements this today — the firehose escape hatch
        (DESIGN §06/§18): pointing it at a self-hosted certstream-server-rust
        sidecar vs. calidog.io's public feed, or flipping it on/off, without
        a redeploy. `configured: false` means no admin has ever written an
        override; the plugin is running exactly what config.yaml declared.
        404s for a plugin that isn't registered, or that has no configurable
        settings at all.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfig" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [ops]
      operationId: replacePluginConfig
      summary: Set a plugin's connection settings
      description: |
        Requires config.yaml to have opted this plugin into runtime
        overrides first (`ingest.certstream.db_override: true`) — 409
        otherwise, naming the key to set. Applies live immediately
        (`applied_live: true`) unless the running process couldn't hot-apply
        it, in which case the write still durably persists and takes effect
        on the next restart. `auth_token` omitted leaves any already-stored
        token untouched; an explicit empty string clears it. 409 if
        `auth_token` is set but `MERKLEYE_ENCRYPTION_KEY` isn't configured
        on this deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PluginConfigWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/config:
    get:
      tags: [ops]
      operationId: getConfig
      summary: Effective configuration, secrets redacted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/summary:
    get:
      tags: [ops]
      operationId: getSummary
      summary: Dashboard rollup
      description: |
        One request for everything above the fold on the dashboard.

        Without this the UI has to fetch every match and count client-side,
        which is unbounded transfer that gets worse exactly as a deployment
        gets busier — which is when the dashboard matters most.

        Ingestion health is included rather than left to /plugins because an
        empty findings list means one of two opposite things (nothing happened,
        or ingestion is dead) and the dashboard must never present them alike.
      parameters:
        - name: window
          in: query
          schema:
            type: string
            default: "24h"
            pattern: "^$|^0*[1-9][0-9]{0,5}(ns|us|ms|s|m|h)([0-9]{1,6}(ns|us|ms|s|m|h))?$"
          description: Go duration string bounding the windowed counts.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/search:
    get:
      tags: [domains, variants, findings]
      operationId: search
      summary: Search domains, matches and variants in one request
      description: |
        Answers "have I seen this anywhere" without the caller already
        knowing which watched domain to ask — the three places an analyst
        pastes a suspicious name, an issuer string, or a certificate
        fingerprint:

        - `domains`: substring match against watched domain names
          (config.yaml-sourced, same as `GET /domains`).
        - `matches`: substring match against `matched_name`, or against the
          certificate's `issuer_org`/`issuer_dn`/`subject_dn`/`serial_hex`;
          a well-formed 64-character hex `q` is additionally matched against
          the certificate's `sha256` exactly. Unscoped across every watched
          domain, unlike `GET /domains/{id}/matches`.
        - `variants`: substring match against `fqdn`, across every watched
          domain's currently active variant set.

        `limit` applies per category, not to the response as a whole: a
        caller asking for 10 gets up to 10 of each, not 10 split three ways.
      parameters:
        - name: q
          in: query
          required: true
          description: Search term. Matched case-insensitively as a substring in every category.
          schema: { type: string, minLength: 1, pattern: "^[^\\u0000]*[^\\u0000\\s][^\\u0000]*$" }
        - name: limit
          in: query
          description: Maximum results per category.
          schema:
            # An empty value means "no filter" — see the note on the
            # date filters. The integer form is what a caller sends.
            anyOf:
              - { type: integer, minimum: 1, maximum: 50, default: 10 }
              - { type: string, maxLength: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/matches/acknowledge:
    post:
      tags: [findings]
      operationId: acknowledgeMatches
      summary: Acknowledge several matches at once
      description: |
        A renewal wave or a noisy variant set produces dozens of low-severity
        matches together. Acknowledging them one at a time is dozens of round
        trips and dozens of audit rows for what was one human decision.

        Partial success is reported rather than rolled back: one stale id in a
        batch of fifty must not discard the other forty-nine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  # A null element decodes to 0, which the handler then treats
                  # as "no such match" rather than rejecting — encoding/json
                  # cannot distinguish it from an absent element.
                  items: { type: [integer, "null"], format: int64 }
                  minItems: 1
                  maxItems: 500
                note: { type: [string, "null"] }
      responses:
        "200":
          description: Outcome per id
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: integer }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/matches/{id}/allowlist:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [findings]
      operationId: allowlistMatch
      summary: Mark a match as not a threat
      description: |
        The "not a threat" action — the most-used control in the triage
        screen. Allowlists the DNS name, never the certificate: this match
        is one sha256, but the name keeps issuing certificates, and a
        renewal 60 days from now would alert all over again.

        `scope` picks which name, and is the operator's call:

        - `hostname` (default) — the matched SAN, e.g. `login.paypa1.com`.
          Other hosts under the same lookalike still alert. Too narrow is
          one more alert to triage; too broad is a phishing host on an
          already-dismissed lookalike that is never reported, which is why
          this is the default.
        - `domain` — the variant's registrable domain, e.g. `paypa1.com`.
          Same effect as POST /variants/{id}/allowlist.

        For an exact match `scope` is ignored and matched_name is written,
        which is informational only since exact matches aren't
        allowlist-checked (DESIGN G-09).

        Already allowlisted is success, not a conflict.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: |
                    Why this is benign. Unexplained allowlist entries are
                    indistinguishable from mistakes six months later.
                scope:
                  type: string
                  enum: [hostname, domain]
                  default: hostname
                  description: |
                    Which name to allowlist — the matched hostname, or the
                    whole variant registrable domain.
      responses:
        "204": { description: Allowlisted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/certificates/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        description: Lowercase hex SHA-256 of the DER — the deduplication key.
    get:
      tags: [findings]
      operationId: getCertificate
      summary: Certificate detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/certificates/{sha256}/pem:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      tags: [findings]
      operationId: getCertificatePEM
      summary: Certificate as PEM
      description: |
        Returns 404 rather than an empty body when certificate retention is
        disabled — the DER is not stored by default, so there is nothing to
        encode. See DESIGN §18, open decision 3.
      responses:
        "200":
          description: PEM-encoded certificate
          content:
            application/x-pem-file:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/variants/preview:
    post:
      tags: [variants]
      operationId: previewVariants
      summary: Dry-run a variant generation
      description: |
        Returns the count a generation would produce without committing it, so
        an operator can see that widening the TLD list turns 5,000 variants
        into 90,000 before they do it. See DESIGN G-17. Runs a real dnstwist
        generation synchronously but commits nothing: no VariantSet is
        created. 501s under the same condition POST .../variants/regenerate
        does — variant generation not configured (`generator_url` unset, see
        PUT /api/v1/settings/variants).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantPreviewRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantPreviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "502":
          description: The dnstwist sidecar rejected or failed the preview request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notifications/test:
    post:
      tags: [ops]
      operationId: testNotificationChannel
      summary: Fire a test notification through a channel
      description: |
        Verifying delivery before relying on it is the difference between a
        working alert path and one that is discovered broken during an incident.
        Delivers immediately through internal/notify.Engine.Send, bypassing
        dedup, severity routing and rate limiting entirely — Dispatch's
        throttling exists to protect against alert fatigue from real
        findings, none of which applies to a single deliberate test send.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTestRequest" }
      responses:
        "204": { description: Delivered }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "502":
          description: The channel's own delivery attempt failed (e.g. Slack/Discord/SMTP rejected it or was unreachable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/EncryptionKeyNotConfigured" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/audit:
    get:
      tags: [ops]
      operationId: listAuditLog
      summary: Audit log
      description: |
        Append-only. Actions are `{resource}.{crud_verb}` — domain.create,
        domain.update, domain.delete, domain.restore, domain.purge,
        policy.update, allowlist.create, allowlist.delete,
        notification_channel.create, notification_channel.update,
        notification_channel.delete, match.acknowledge, token.revoke.
        Reads are deliberately not audited: /metrics covers access patterns,
        and auditing every GET would drown the signal.

        Every domain/policy/allowlist/notification-channel write route calls
        the store's Audit write — see DESIGN §13 for why these are all
        Postgres-owned and fully API-writable in the first place. A failed
        audit-log write is logged, not surfaced to the caller: the mutation
        it follows has already succeeded and persisted by the time it runs,
        so failing the whole request over an observability gap would turn
        that gap into a user-visible outage.
      parameters:
        - { name: actor,  in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
        - name: since
          in: query
          schema:
            type: string
            # Empty means "no filter" — see the note on the match date
            # filters below.
            anyOf:
              - { format: date-time }
              - { maxLength: 0 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  next_cursor: { type: [string, "null"] }
                  next: { type: [string, "null"] }
                  total:
                    type: integer
                    description: Row count matching the current filters, independent of cursor/limit/page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: How to sign in
      description: |
        Public — no credentials. Lets the UI render the right sign-in screen
        without hardcoding deployment facts, so one bundle serves every install.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  oidc_enabled: { type: boolean }
                  provider_name: { type: string }
                  login_url:
                    type: [string, "null"]
                    description: |
                      Navigate here to start sign-in. Never fetch it — it 302s
                      to the identity provider, and fetch cannot hand the
                      browser off to a third-party login page.
                  bearer_enabled: { type: boolean }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentPrincipal
      summary: The current principal
      description: |
        The UI's entire identity surface. Called once on load; a 401 means show
        the sign-in screen. Scopes drive which controls render enabled — the
        server enforces regardless, and the UI never treats its own check as
        security.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        # No "403": this is the one authenticated route with no RequireScope
        # (see Routes()) — any valid token may ask who it belongs to, so the
        # scope check that produces a 403 never runs here.
        "400": { $ref: "#/components/responses/BadRequest" }


components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Hashed (argon2id) opaque token. Scopes: read | write | admin.
        Internal-only routes (/internal/v1/*) use a separate shared-secret
        header and are excluded from this spec — they are loopback-only.
    cookieAuth:
      type: apiKey
      in: cookie
      name: merkleye_session
      description: |
        Browser session for humans, established by the Authentik redirect flow
        and set server-side. Opaque and httpOnly, so JavaScript never reads it
        and the UI never handles a token.

        Deliberately NOT declared as `openIdConnect`. The backend is the OIDC
        client — it performs the code exchange, validates the ID token and
        issues this cookie. Declaring an openIdConnect scheme would instruct a
        generated client to run the flow itself, which is an architecture that
        does not exist here and which a code generator could scaffold in error.
        The redirect endpoints are ordinary documented paths under /auth.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        # An empty value means "no filter" — see the note on the
        # date filters. The integer form is what a caller sends.
        anyOf:
          - { type: integer, format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807 }
          - { type: string, maxLength: 0 }
      description: |
        Opaque cursor from a previous response's next_cursor — today the `id`
        of the last row on that page, which is why it is an integer here and
        an opaque string on the variant routes. Cursor rather than offset
        because rows insert continuously — an offset skips records whenever
        anything lands between two pages.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Page:
      name: page
      in: query
      description: 1-based page number — an offset-based alternative to cursor. Wins over cursor if both are supplied. See total.
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
      example: 1

  responses:
    BadRequest:
      description: Invalid path or query parameter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No session cookie and no bearer token, or the credential presented is
        invalid or expired. The UI treats this as "show the sign-in screen",
        not as an error to report.

        This is the plain Error envelope, not an RFC 9457 Problem: the
        authenticator rejects the request before any handler runs, and there
        is only ever one reason, so there is no cause for a client to branch
        on. Problem documents are reserved for the conflicts that genuinely
        have several distinguishable causes — see the Problem schema.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Authenticated, but the token's scopes do not include the one this
        route requires — read, write or admin, see internal/api.RequireScope.
        Unlike a 401 this will not be fixed by signing in again; the token
        itself is too narrow.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        The write conflicts with existing state. Returned as a Problem
        (RFC 9457), not the plain Error every other 4xx here uses — a single
        route can 409 for more than one distinct reason (e.g. purge: "not
        soft-deleted yet" vs. "still referenced by something purge cannot
        clear"), so
        `type` is what a client branches on, never `detail`'s prose. The
        `type` values this API actually issues today:

        - `https://merkleye.dev/problems/domain-name-conflict` —
          POST /domains: this name is already in use by another live domain,
          which GET /domains will show you.
        - `https://merkleye.dev/problems/domain-name-held-by-deleted` —
          POST /domains: the name belongs to a soft-deleted domain, which
          holds it until it is restored or purged (uniqueness on the name is
          unconditional). No default listing shows that domain, so `detail`
          names its id and both routes out: POST /domains/{id}/restore to
          bring it back with the matches, variant sets and policies recorded
          against it, or DELETE /domains/{id}/purge to discard those and then
          create this domain fresh. GET /domains?status=deleted lists the
          candidates.
        - `https://merkleye.dev/problems/domain-not-deleted` —
          DELETE /domains/{id}/purge: the domain is still live. Purge is
          only ever the second step of a two-step remove — soft-delete
          (DELETE /domains/{id}) it first.
        - `https://merkleye.dev/problems/domain-still-referenced` —
          DELETE /domains/{id}/purge: something still references the domain
          that the purge cascade does not clear (it does clear matches,
          alerts, variant sets, variant changes, policies and backfill
          jobs). Nothing was deleted; use DELETE /domains/{id} to
          soft-delete instead.
        - `https://merkleye.dev/problems/allowlist-entry-conflict` —
          POST /allowlist: this fqdn is already allowlisted.
        - `https://merkleye.dev/problems/notification-channel-name-conflict`
          — POST /notification-channels, PATCH /notification-channels/{id}:
          this name is already in use by another channel.
        - `https://merkleye.dev/problems/notification-channel-test-failed` —
          POST /notification-channels, PATCH /notification-channels/{id}:
          the verification message did not deliver through the supplied
          `url`, so nothing was written. This one is a 502, not a 409 — see
          that response's own description.
        - `https://merkleye.dev/problems/plugin-db-override-disabled` —
          PUT /plugins/{id}/config: this plugin hasn't opted into runtime DB
          overrides (`ingest.<plugin>.db_override: true` in config.yaml).
        - `https://merkleye.dev/problems/plugin-encryption-key-not-configured`
          — PUT /plugins/{id}/config: `auth_token` was set but
          `MERKLEYE_ENCRYPTION_KEY` isn't configured on this deployment.
        - `https://merkleye.dev/problems/ca-identifier-conflict` —
          POST /cas: this CAA identifier is already in the catalog, possibly
          as a CCADB-mirrored entry.
        - `https://merkleye.dev/problems/ca-system-managed` —
          DELETE /cas/{id}: the CA is mirrored from CCADB and owned by the
          catalog sync, which would recreate it. Only CAs added through
          POST /cas can be deleted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplementedYet:
      description: |
        Not implemented yet. Deliberately 501 rather than 404: the route
        exists and is correct, the backing feature just lands in a later
        phase. See DESIGN §17.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EncryptionKeyNotConfigured:
      description: |
        MERKLEYE_ENCRYPTION_KEY is not configured on this server, so a
        notification channel's secret URL cannot be encrypted or decrypted
        — see docs/OPERATIONS.md's key-management section.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotificationChannelTestFailed:
      description: |
        The verification message could not be delivered through the supplied
        channel `url`, so nothing was written — the channel was not created,
        or the patch was not applied. An RFC 9457 Problem with
        `type: https://merkleye.dev/problems/notification-channel-test-failed`
        so a client can tell this apart from any other upstream failure;
        `detail` carries the transport error, which is what an operator needs
        to fix the URL. Retry once the destination accepts the message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. `type` is a stable machine-readable
        identifier, so a client branches on it rather than sniffing for the
        presence of bespoke fields. Retrofitting an error contract after
        clients exist means supporting both shapes forever.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ["https://merkleye.dev/problems/unauthorized"]
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    Principal:
      type: object
      description: The authenticated caller, however they authenticated.
      properties:
        subject:
          type: string
          description: IdP `sub` for humans, client_id for services, token name otherwise.
        display: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        issued_via:
          type: string
          enum: [bearer, oidc_user, oidc_service, break_glass]
        expires_at: { type: [string, "null"], format: date-time }

    Summary:
      type: object
      description: Everything the dashboard needs above the fold, in one request.
      properties:
        window: { type: string }
        unacknowledged:
          type: object
          description: Open findings by severity — the triage backlog.
          properties:
            critical: { type: integer }
            high:     { type: integer }
            medium:   { type: integer }
            info:     { type: integer }
        matches_in_window:
          type: object
          properties:
            exact:   { type: integer }
            variant: { type: integer }
        watch_set:
          type: object
          properties:
            domains:     { type: integer }
            variants:    { type: integer }
            allowlisted:
              type: integer
              description: |
                Number of allowlist entries — the rows GET /allowlist
                returns, and nothing else. Not the matcher's suppression-key
                count, which also holds every watched domain (auto-allowlisted
                so we never alert on our own certificates) and would make this
                tile disagree with the list it links to.
        ingestion:
          type: object
          description: |
            Included here, not left to /plugins, because zero findings is good
            news only if ingestion is alive. Presented alone the count is
            ambiguous, and the ambiguity favours complacency.
          properties:
            ingestion_watchdog_tripped: { type: boolean }
            last_observation_at:  { type: [string, "null"], format: date-time }
            observations_total:   { type: integer, format: int64 }
        generated_at: { type: string, format: date-time }

    SearchResult:
      type: object
      description: |
        The response to GET /api/v1/search. Each array holds up to `limit`
        items for that category, independently of the other two — see the
        route's own description for what a substring hit means per category.
      properties:
        query: { type: string }
        domains:
          type: array
          items: { $ref: "#/components/schemas/Domain" }
        matches:
          type: array
          items: { $ref: "#/components/schemas/Match" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }

    BackfillJob:
      type: object
      description: |
        One SSLMate historical walk. Durable: the walk survives a restart,
        resuming from `after_cursor` rather than starting over.
      properties:
        id:
          type: [integer, "null"]
          format: int64
          description: |
            The walk's own id. Null for a domain that has never had one
            scheduled — GET /backfill renders those as `pending` so the fleet
            view has a row per domain, and a row with no run behind it has no
            id to give. Two entries in a domain's history differ by this.
        domain_id:
          type: integer
          format: int64
          description: |
            The watched domain this walk belongs to — the same id as
            GET /domains/{id}, so a job links straight back without a
            client-side name→id map. Backed by a NOT NULL foreign key, so it
            always names a domain that exists.
        domain: { type: string }
        state:
          type: string
          enum: [pending, running, deferred, done, failed]
          description: |
            `pending` with a non-zero `pages_done` is a resumable walk that
            yielded its turn so other domains could run, not one that has
            not started.
        trigger:
          type: string
          enum: [schedule, manual, onboard]
          description: |
            Why this walk exists — the recurrence sweep, an explicit
            POST /domains/{id}/backfill, or the domain having no walk yet.
        pages_done:     { type: integer, description: Pages fetched across every attempt at this job. }
        issuances_seen: { type: integer, description: Issuance rows read from the API, before the expired-certificate filter. }
        certs_emitted:
          type: integer
          description: |
            Observations pushed into the pipeline. Reported separately from
            issuances_seen because a domain whose history is entirely
            expired reads thousands of rows and emits none — without both
            numbers that is indistinguishable from a stalled walk.
        attempt:      { type: integer, description: Failed attempts so far. Rate limits do not count. }
        after_cursor: { type: string, description: "SSLMate's paging cursor: the point a restart resumes from." }
        owner:        { type: string, description: Process holding the lease while running; empty otherwise. }
        lease_expires_at:
          type: [string, "null"]
          format: date-time
          description: |
            When an unrefreshed claim lapses and the job becomes
            reclaimable — how a walk is recovered from a killed process.
        next_run_at:
          type: [string, "null"]
          format: date-time
          description: When a pending or deferred job becomes claimable. Null on terminal states.
        last_error:    { type: [string, "null"] }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time, description: Touched on every progress write, so a stalled worker is visible as a stale row. }
        started_at:    { type: [string, "null"], format: date-time }
        finished_at:   { type: [string, "null"], format: date-time }
        backfilled_at:
          type: [string, "null"]
          format: date-time
          description: The domain's last completed walk, and the clock the recurrence interval measures from.

    BackfillStatus:
      type: object
      description: The response to GET /api/v1/backfill.
      properties:
        enabled:
          type: boolean
          description: |
            Mirrors ingest.sslmate_backfill.enabled. False means every row
            below is stale history from a previous run, not something
            currently in progress.
        interval_seconds:
          type: integer
          description: |
            ingest.sslmate_backfill.interval — how long after a completed
            walk a domain is walked again. 0 means recurrence is off and a
            completed domain is never re-walked without a manual trigger.
        queue_length:
          type: integer
          description: |
            Jobs claimable right now. Read from Postgres, so unlike the
            in-process queue depth this replaced it survives a restart.
        counts:
          type: object
          properties:
            pending:  { type: integer }
            running:  { type: integer }
            deferred: { type: integer, description: Currently rate-limited or backing off. }
            done:     { type: integer }
            failed:   { type: integer, description: Stopped retrying; needs a human. }
        domains:
          type: array
          items: { $ref: "#/components/schemas/BackfillJob" }

    AuditEntry:
      type: object
      description: |
        Append-only. before/after are full row snapshots rather than a diff — a
        diff is derivable from two snapshots, but a snapshot is not recoverable
        from a diff that dropped a field. See DESIGN G-14.
      properties:
        id:          { type: integer, format: int64 }
        actor:       { type: string }
        action:
          type: string
          description: "{resource}.{crud_verb}, e.g. policy.update"
          examples: ["domain.create", "match.acknowledge", "allowlist.create"]
        entity_type: { type: string }
        entity_id:   { type: [integer, "null"], format: int64 }
        before:      { type: [object, "null"] }
        after:       { type: [object, "null"] }
        ip:          { type: string }
        user_agent:  { type: string }
        at:          { type: string, format: date-time }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    Health:
      type: object
      properties:
        status: { type: string }
        ingestion_watchdog_tripped: { type: boolean }
        checked_at: { type: string, format: date-time }

    Severity:
      type: string
      enum: [suppressed, info, medium, high, critical]

    Domain:
      type: object
      properties:
        id: { type: integer, format: int64 }
        domain:
          type: string
          description: A-label form, lowercased, no trailing dot.
        include_subdomains: { type: [boolean, "null"] }
        enabled:
          type: boolean
          description: |
            A manual pause/resume toggle, independent of deletion — see PATCH
            /domains/{id}.

            A disabled domain is not watched: it leaves the matcher snapshot
            and the certspotter watchlist, along with every variant generated
            from it, so no certificate on it produces a match. It stays
            *allowlisted* while disabled, so disabling a domain can never
            make it start alerting as some other watched domain's lookalike —
            disabling is not disowning. Its variant sets, matches and history
            are untouched, and re-enabling restores the whole set.
        expected_issuers:
          type: array
          items: { type: string }
          description: |
            Case-insensitive substrings matched against the issuer DN and O.
            Substring rather than exact so an intermediate rotation
            (Let's Encrypt R3 → E1) does not read as an attack.
        max_validity_days: { type: integer }
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: |
            Set only on a domain fetched with GET /domains?status=deleted or
            status=all — every other read path excludes soft-deleted domains
            entirely, so this is always null/absent there.
        _self: { type: string, description: "GET this for the domain's own detail — see GET /domains/{id}." }

    DomainCreate:
      type: object
      required: [domain, expected_issuers]
      properties:
        domain:
          type: string
          minLength: 1
          format: idn-hostname
          description: |
            A domain name, in either A-label or Unicode form — normalized to
            A-label on save (the form the matcher requires), with the
            original Unicode form kept for display if the two differ. Must
            not start with `*.`.
        include_subdomains:
          type: [boolean, "null"]
          default: true
        expected_issuers:
          type: array
          items: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
          minItems: 1
          description: |
            Required. Without at least one entry, every routine renewal
            alerts as critical (DESIGN G-04) — find yours with:
            `openssl s_client -connect <domain>:443 -servername <domain>
            </dev/null 2>/dev/null | openssl x509 -noout -issuer`
        max_validity_days:
          type: [integer, "null"]
          minimum: 0
          # The CA/Browser Forum ceiling in force today (internal/cabf,
          # ballot SC-081). It steps down — 100 on 2027-03-15, 47 on
          # 2029-03-15 — so this number goes stale on a date rather than on
          # a commit. TestMaxValidityDaysCeilingMatchesSpec fails the build
          # on the day it does, which is the only reason it is safe to name
          # a moving limit here at all.
          maximum: 200
          default: 0
          description: |
            0 (default) means unenforced. Otherwise it must be at or below
            the CA/Browser Forum's publicly-trusted TLS maximum validity in
            effect on the day of the request (Ballot SC-081); a longer value
            is rejected with 400. That ceiling steps down over time — 398
            days before 2026-03-15, 200 days from 2026-03-15, 100 days from
            2027-03-15, 47 days from 2029-03-15 — so a value accepted today
            can be rejected after the next step lands, with no server
            upgrade in between.

            The rejection is not pedantry: no publicly-trusted CA will issue
            a certificate longer than the Forum's ceiling, so a policy above
            it can never be violated and the domain reads as permanently
            compliant. A value *below* the ceiling is the useful case, and
            flags otherwise-compliant certificates as violations by design.

    DomainPatch:
      type: object
      description: A null/omitted field is left unchanged.
      properties:
        include_subdomains: { type: [boolean, "null"] }
        enabled:
          type: [boolean, "null"]
          description: |
            Setting this false stops watching the domain and its variants
            within a second or two — see WatchedDomain.enabled.

    IssuerPolicy:
      type: object
      description: |
        expected_issuers/max_validity_days here are the exact same
        underlying row(s) as Domain's own fields of the same name, not an
        independent copy — a PUT here is immediately reflected in the
        next GET /domains/{id}, and vice versa (DomainCreate seeds this
        table too). A client never needs to reconcile "domain says X,
        policy says Y" drift or re-fetch both after writing either one.
      properties:
        expected_issuers:
          type: array
          items: { type: string }
        max_validity_days: { type: integer }
        _self: { type: string }

    IssuerPolicyWrite:
      type: object
      required: [expected_issuers]
      description: Replaces the whole policy as a unit — same fields and same G-04 requirement as DomainCreate's.
      properties:
        expected_issuers:
          type: array
          items: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
          minItems: 1
        max_validity_days:
          type: [integer, "null"]
          minimum: 0
          # The CA/Browser Forum ceiling in force today (internal/cabf,
          # ballot SC-081). It steps down — 100 on 2027-03-15, 47 on
          # 2029-03-15 — so this number goes stale on a date rather than on
          # a commit. TestMaxValidityDaysCeilingMatchesSpec fails the build
          # on the day it does, which is the only reason it is safe to name
          # a moving limit here at all.
          maximum: 200
          default: 0
          description: Same rules and same CA/Browser Forum ceiling as DomainCreate's — see there.

    VariantSettings:
      type: object
      properties:
        generator_url:
          type: string
          description: dnstwist sidecar base URL. Empty disables variant generation.
        default_tlds:
          type: array
          items: { type: string }
        default_dictionary:
          type: array
          items: { type: string }
        max_per_domain: { type: integer }
        scan_enabled:
          type: boolean
          description: |
            Whether the variant scanner refreshes registration and DNS state
            for active sets. **On by default**, including on upgrade.

            This is outbound traffic aimed at attacker-controlled
            infrastructure and at third-party registries, at thousands of
            names per watched domain — so it is a deliberate choice, not an
            oversight. Off is not the safer default it looks like: with no
            scanner, registration and DNS state never fill in, the variant
            change feed never fires, and the certspotter watchlist cannot
            narrow to the names somebody actually took, so every generated
            permutation stays watched. Set it to false here if your
            deployment wants that traffic proxied or absent; nothing turns it
            back on afterwards.
        scan_interval_seconds:
          type: integer
          description: How often each variant in an active set gets its DNS probe.
        scan_dns_qps:
          type: number
          description: Ceiling on outbound DNS queries per second across the sweep.
        scan_rdap_qps:
          type: number
          description: |
            Ceiling on outbound RDAP requests per second. Registries do not
            publish their thresholds; 1-2/s is the commonly cited safe
            practice, and a 429 response backs off further on its own.
        scan_rdap_rotation_days:
          type: integer
          description: |
            How often every variant is re-verified against RDAP, independent
            of the re-checks a DNS change triggers. Measured in days because
            a daily full-set RDAP sweep would exceed any registry's
            tolerance.
        scan_resolvers:
          type: array
          items: { type: string }
          description: |
            Resolvers the sweep queries. Empty means the host's own
            (/etc/resolv.conf). Queries never go directly to authoritative or
            root servers — enterprise networks routinely allow DNS only to
            their own resolvers.
        updated_at: { type: string, format: date-time, nullable: true }
        _self: { type: string }

    VariantSettingsWrite:
      type: object
      # max_per_domain only: it decodes to 0 when absent and the handler
      # rejects that, so it genuinely has to be sent. default_tlds was listed
      # here too, but omitting it is accepted — the field decodes to a nil
      # slice and is stored as an empty list, which is also what ADR-0042's
      # partial writes rely on.
      required: [max_per_domain]
      description: |
        Replaces the generation fields as a unit — same PUT semantics as
        IssuerPolicyWrite.

        The `scan_*` fields are the exception: an omitted one keeps its
        current value rather than resetting to zero. They postdate this
        route's first clients, and a generation-only body was silently
        setting `scan_enabled` to false and zeroing every tunable, which
        stops the sweep and parks every variant's `registration` at
        `unknown`. Send a `scan_*` key only to change it; send `[]` to clear
        `scan_resolvers`.
      properties:
        generator_url:
          type: [string, "null"]
          pattern: "^$|^[a-zA-Z][a-zA-Z0-9+.-]*://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?(\\?[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?(#[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?$"
          description: |
            Absolute URL of the dnstwist sidecar, or the empty string to
            disable generation. A relative or host-less URL is a 400.
        default_tlds:
          type: [array, "null"]
          items: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
        default_dictionary:
          type: [array, "null"]
          items: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
        max_per_domain: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        scan_enabled: { type: [boolean, "null"] }
        scan_interval_seconds: { type: [integer, "null"], minimum: 0, maximum: 9223372036854775807 }
        scan_dns_qps: { type: [number, "null"], minimum: 0 }
        scan_rdap_qps: { type: [number, "null"], minimum: 0 }
        scan_rdap_rotation_days: { type: [integer, "null"], minimum: 0, maximum: 9223372036854775807 }
        scan_resolvers:
          type: [array, "null"]
          items: { type: [string, "null"], pattern: "^[^\\u0000]*$" }

    ScoringSettings:
      type: object
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        updated_at: { type: string, format: date-time, nullable: true }
        _self: { type: string }

    ScoringSettingsWrite:
      type: object
      required: [critical, high, medium]
      description: Must satisfy critical > high > medium > 0.
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }

    CAARecord:
      type: object
      properties:
        flag: { type: integer, description: "Always 0 (non-critical) — see internal/caa.Record." }
        tag: { type: string, enum: [issue, issuewild, iodef] }
        value: { type: string }

    CAAResult:
      type: object
      properties:
        domain:
          type: string
          description: Normalized (lowercased, no trailing dot) form of the watched domain.
        watched_domain: { $ref: "#/components/schemas/Domain" }
        records:
          type: array
          items: { $ref: "#/components/schemas/CAARecord" }
          description: |
            Empty when no expected_issuers entry resolved to a known CA —
            see the unmapped-issuer note on GET /domains/{id}/caa.
        zone:
          type: string
          description: |
            `records` pre-rendered as zone-file lines (one `<domain>. CAA
            <flag> <tag> "<value>"` per record), ready to paste into a DNS
            provider's console or a zone file. Empty when records is.
        unmapped_issuers:
          type: array
          items: { type: string }
          description: expected_issuers entries that did not resolve to a known CA.
        warnings:
          type: array
          items: { type: string }
        _self: { type: string }

    DNSProvider:
      type: object
      properties:
        name: { type: string }
        dashboard_url:
          type: string
          description: |
            The provider's own DNS/domain management entry point. Never a
            deep link into a specific account or zone — always requires
            login.

    DNSProviderResult:
      type: object
      properties:
        domain: { type: string }
        nameservers:
          type: array
          items: { type: string }
        providers:
          type: array
          items: { $ref: "#/components/schemas/DNSProvider" }
          description: |
            Usually one entry. More than one means a split or migrating
            delegation; empty means none of the queried nameservers matched
            a known provider.
        warnings:
          type: array
          items: { type: string }
        _self: { type: string }

    CA:
      type: object
      description: |
        One entry in the CA catalog. `name` is what a picker shows;
        `issue_hostname` is what goes in a CAA record and what `cas`/
        `exclude_cas` resolve against. The two are separate because a CA
        can be selected by a name that is not its hostname.
      properties:
        id:
          type: [integer, "null"]
          format: int64
          description: |
            The stored row's id, for DELETE /api/v1/cas/{id}. Null for
            `source: curated` entries, which are compiled into the server
            and have no row to delete.
        name:
          type: string
          description: |
            Canonical name to send back in `cas`/`exclude_cas` — matched the
            same case-insensitive, substring way as `expected_issuers`. For
            a stored entry this is the CA owner (CCADB's own naming, or what
            the admin typed).

            Not unique: a stored entry's name is its `owner`, and one owner
            publishes many issue hostnames, so several entries repeat one
            name and differ only in `issue_hostname`. Key a list on `id`
            (or `issue_hostname` for curated entries, which have none), not
            on this.
        issue_hostname:
          type: string
          description: The value this CA publishes for a CAA `issue`/`issuewild` record.
        issuer_patterns:
          type: array
          items: { type: string }
          description: |
            The case-insensitive substrings that identify this CA in an
            observed certificate's issuer DN or O — this entry's canonical
            name plus its aliases, lowercased and deduplicated. These are
            exactly what GET /matches?ca=<issue_hostname> resolves to.

            Present only for `curated` entries. Absent for `ccadb` and
            `operator` ones, whose only label is `owner` — free text from
            CCADB's CA-owner column, a display label that makes no claim
            about what a certificate's issuer field says. Substituting it
            would turn a documented non-matcher into a silent one.

            Read absent or empty as **"this identifier is not filterable"**,
            which is not the same as "this CA has no certificates": omit the
            link to GET /matches?ca= rather than offering one that 400s.
            Where two curated entries share an issue hostname, each carries
            the union of both CAs' patterns.
        notes:
          type: string
          description: A caveat worth surfacing about this CA's identifier, when one exists.
        source:
          type: string
          enum: [curated, ccadb, operator]
          description: |
            Where this entry comes from. `curated` is internal/caa.KnownCAs,
            compiled in and the only source CAA record generation resolves
            against. `ccadb` is a row mirrored from CCADB's published report.
            `operator` is a CA an admin added through POST /api/v1/cas.
        system_managed:
          type: boolean
          description: |
            True for `curated` and `ccadb` entries — the ones no operator can
            delete. This is the bit a UI branches on to decide whether to
            offer a delete control; `source` says why.
        owner:
          type: string
          description: |
            CA owner as CCADB names it, or as the admin typed it. Absent for
            curated entries, whose `name` already is the owner.

            A display label, not an identity: it repeats once per issue
            hostname that owner publishes. `Amazon Trust Services` is eight
            entries in this list (amazon.com, amazonaws.com, amazonaws.eu,
            amazontrust.com, amazontrustservices.eu, amznts.eu,
            aws.amazon.com, awstrust.com) and `DigiCert` thirteen. Group by
            it for display if you like, but do not deduplicate on it — a CA
            may validate issuance against any of its identifiers, so an
            operator who only sees one of the eight can write a CAA record
            that blocks the issuance they meant to allow.

    KnownCAsResult:
      type: object
      properties:
        cas:
          type: array
          items: { $ref: "#/components/schemas/CA" }
          description: |
            One entry per CAA identifier — the catalog as it is stored, and
            what a table row or a delete addresses. Several entries repeat one
            `name`; see `groups`.
        groups:
          type: array
          items: { $ref: "#/components/schemas/CAGroup" }
          description: |
            The same catalog collapsed to one entry per selectable name.
            Derived from `cas` in the same response and always consistent
            with it: every entry in `cas` appears in exactly one group.

            This exists so a picker does not have to re-derive it. `name` is
            not unique in `cas` — for a stored entry it is the CA owner, and
            one owner publishes many identifiers — so a picker built
            straight from `cas` renders one CA as several identical-looking
            choices that all submit the same string.
        _self: { type: string }

    CAGroup:
      type: object
      description: |
        One selectable CA, and every CAA identifier it covers.

        The grouping key is `name` rather than `owner` because `name` is what
        `cas`, `exclude_cas` and `expected_issuers` are matched against —
        grouping by anything else would produce choices a caller cannot
        submit. A curated entry and CCADB rows sharing a name land in one
        group, which is why `sources` is a list.
      properties:
        name:
          type: string
          description: The value to send back in `cas`/`exclude_cas`/`expected_issuers`. Unique across `groups`.
        identifiers:
          type: array
          items: { type: string }
          description: |
            Every CAA identifier this name covers, hostname-sorted. Usually
            one; thirteen for DigiCert. A CA may validate issuance against
            any of them, so a CAA record naming only one of a multi-identifier
            CA can block issuance that was meant to be allowed.
        sources:
          type: array
          items: { type: string, enum: [curated, ccadb, operator] }
          description: Which halves of the catalog contributed, deduplicated and sorted. See `CA.source`.
        notes:
          type: array
          items: { type: string }
          description: Caveats carried by any entry in the group — empty when there are none.

    CAWrite:
      type: object
      required: [identifier, owner]
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 253
          pattern: "^[A-Za-z0-9_-]+(\\.[A-Za-z0-9_-]+)+$"
          description: |
            The CAA issue hostname this CA publishes, e.g.
            "pki.example.internal". Lowercased on write, and must be a dotted
            ASCII hostname — it is published verbatim in a CAA `issue`
            record. Must not already be in the catalog, including as a
            CCADB-mirrored entry.
        owner:
          type: string
          minLength: 1
          pattern: "^[^\\u0000]*[^\\u0000\\s][^\\u0000]*$"
          description: |
            The human label a picker shows for this CA. Need not be unique —
            reusing a label the catalog already carries is how a second issue
            hostname is added for a CA that is already present. Only
            `identifier` is checked for conflicts.

    Variant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fqdn:
          type: string
          description: Registrable domain (eTLD+1), A-label form. The match key.
        fqdn_unicode:
          type: [string, "null"]
          description: |
            Display form. "xn--80ajb1au1a38g.com" tells a human nothing;
            "ехамрӏе.com" shows the attack at a glance.
        algorithm: { type: string }
        tld: { type: string }
        status:
          type: string
          enum: [active, parked, registered, unregistered, unknown]
          description: |
            The one-word reading, computed from `registration`, `ns_resolves`
            and `last_checked_at` rather than stored: `active` (owned and
            built on), `parked` (bought, nothing standing on it),
            `registered` (delegated over an RDAP negative — stale RDAP, a
            registry glitch, or a name mid-drop), `unregistered` (nobody has
            it, and something looked), `unknown` (nothing has ever scanned
            this name, so there is no verdict — `last_checked_at` is null).

            Every variant starts `unknown`: generation produces names and
            never state, so a freshly generated set reads `unknown`
            throughout until the first scan sweep reaches it. Do not read
            that as `unregistered`; it is the difference between "we looked
            and nobody has it" and "we never looked", and the certspotter
            watchlist watches the second while dropping the first.

            Past that, delegation is the load-bearing signal in both
            directions, which is why a scanned row with an unknown
            registration and nameservers reads `active` while one without
            them reads `unregistered`. Note that `registration: unknown` is
            narrower than `status: unknown` — it says RDAP had no answer for
            a name that *was* scanned.
        registration:
          type: string
          enum: [registered, unregistered, unknown]
          description: |
            RDAP's verdict. `unknown` means no RDAP answer is available —
            the TLD publishes no RDAP service, or nothing has checked yet —
            and is never the same claim as `unregistered`.
        ns_resolves:
          type: boolean
          description: |
            The apex answered with NS records: somebody has published
            nameservers for it. This is what gates the A/AAAA and MX
            lookups — a name nobody has delegated has nothing to resolve.
        resolves:
          type: boolean
          description: An A or AAAA record answered. Equivalent to a non-empty `addresses` on any row scanned since addresses were recorded; kept as its own field because it is the filter key and stays meaningful on older rows.
        addresses:
          type: array
          items: { type: string }
          description: |
            Where the name points: every A and AAAA answer, as one sorted
            list of canonical textual IPs (both families share the list —
            the literal says which it is). Empty when the name resolves to
            nothing, and empty rather than absent for a variant scanned
            before addresses were recorded, so the field is always an array.
        mx:
          type: array
          items: { type: string }
          description: MX hostnames, empty when none. Sorted, so a set only differs when the set itself differs.
        registered_at:
          type: [string, "null"]
          format: date-time
          description: The registration date RDAP reports. Null for a TLD with no RDAP service, or one whose server publishes no registration event.
        first_registered_at:
          type: [string, "null"]
          format: date-time
          description: When Merkleye first observed it registered. Not the registry's date — and the only such date available for a TLD without RDAP.
        registration_checked_at:
          type: [string, "null"]
          format: date-time
          description: Last RDAP verdict. Null means RDAP has never answered for this name.
        state_changed_at:
          type: [string, "null"]
          format: date-time
          description: When any tracked field last changed.
        last_checked_at:
          type: [string, "null"]
          format: date-time
          description: |
            Last completed DNS probe. Null means never scanned, which is
            distinct from scanned and found nothing — an unscanned variant
            must not read as a confirmed negative.
        next_check_at:
          type: [string, "null"]
          format: date-time
          description: When this variant's DNS probe is next due.
        allowlisted:
          type: boolean
          description: |
            This lookalike is marked "not a threat": no certificate on it,
            or on any hostname under it, will produce a match while the
            entry stands. Derived from the live allowlist, not stored on the
            variant, so it survives regeneration into a new variant set and
            can never disagree with what the matcher does. Also true for a
            variant that is itself a watched domain, which is allowlisted
            automatically. See POST /variants/{id}/allowlist.
        watched_domain:
          allOf: [{ $ref: "#/components/schemas/Domain" }]
          description: |
            The watched domain this variant belongs to, resolved through its
            VariantSet — present on every variant, so GET /variants/{id} can
            say "lookalike of example.com" without a separate fetch through
            the variant set.
        _self:
          type: string
          description: |
            GET this for the variant's own detail — see GET /variants/{id}.

    VariantScanProgress:
      type: object
      description: |
        How far the DNS sweep has got through the set of lookalikes being
        listed.

        This exists because the rows cannot say it themselves. `ns_resolves`
        and `resolves` are booleans with no null, so a lookalike nothing has
        probed yet is indistinguishable from one that was probed and
        delegates nothing — a freshly generated domain renders as a full page
        of confident `false`, and filtering it by `ns_resolves=true`
        correctly returns nothing, which reads as "no lookalike is live" when
        the truth is "nobody has looked yet". A row's `last_checked_at` is
        the per-name answer; this is the set-level one.
      required: [enabled, total, scanned, never_scanned]
      properties:
        enabled:
          type: boolean
          description: |
            The live `scan_enabled` setting (PUT /api/v1/settings/variants).
            Without it, "0 of 2979 scanned" is ambiguous between a backlog
            that will drain on its own and a scanner somebody switched off.
        total:
          type: integer
          description: |
            Every variant in the set. Unlike the sibling `total` on the list
            response, this ignores the request's filters: progress is a
            property of the whole set, not of the page being rendered. The
            two are not comparable.
        scanned:
          type: integer
          description: |
            Variants with a determined DNS probe behind them. Counted from
            `last_checked_at`, not `next_check_at` — an indeterminate probe
            schedules a retry without establishing anything, and counting it
            would report progress that observed nothing.
        never_scanned:
          type: integer
          description: "`total` - `scanned`, carried explicitly so every consumer reads the same number."
        first_scanned_at:
          type: [string, "null"]
          format: date-time
          description: Earliest probe in the set; null when nothing has been probed.
        last_scanned_at:
          type: [string, "null"]
          format: date-time
          description: Most recent probe in the set; null when nothing has been probed.
        next_check_at:
          type: [string, "null"]
          format: date-time
          description: |
            The earliest scheduled probe in the set, null when none is
            scheduled — the normal reading for a set nothing has swept yet,
            since `next_check_at` is only written once a probe has happened.

            This is not an ETA for that first sweep. The scanner works one
            global queue across every watched domain, so when an unscanned
            set gets looked at depends on the work queued ahead of it, which
            nothing in this object measures.

    DNSSweep:
      type: object
      description: |
        One scope's coverage by the DNS half of variant scanning.
      required: [total, scanned, never_scanned, due_now, ns_resolves, resolves]
      properties:
        total:
          type: integer
          description: Every variant in scope, probed or not.
        scanned:
          type: integer
          description: |
            Variants with a determined probe behind them. Counted from
            `last_checked_at`, not `next_check_at` — an indeterminate probe
            schedules a retry without establishing anything, and counting it
            would report progress that observed nothing.
        never_scanned:
          type: integer
          description: "`total` - `scanned`, sent so two consumers cannot subtract differently."
        due_now:
          type: integer
          description: |
            Probes the sweep could claim this instant: `next_check_at` in the
            past, or null, which is what a freshly generated variant has.

            This is the backlog, and the only field here that separates
            "behind" from "idle" — a stale `last_scanned_at` over `due_now: 0`
            is a sweep with nothing to do, the same timestamp over a large
            `due_now` is one that has stopped.
        ns_resolves:
          type: integer
          description: Names in scope that answered with NS records — delegated.
        resolves:
          type: integer
          description: Names in scope that answered with an A or AAAA record.
        first_scanned_at:
          type: [string, "null"]
          format: date-time
          description: Earliest probe in scope; null when nothing has been probed.
        last_scanned_at:
          type: [string, "null"]
          format: date-time
          description: |
            Most recent probe in scope; null when nothing has been probed.
            Read together with `due_now` — see that field.
        next_check_at:
          type: [string, "null"]
          format: date-time
          description: |
            The earliest scheduled probe in scope, null when none is
            scheduled. Not an ETA: the sweep works one global queue across
            every watched domain, so when a given probe actually happens
            depends on the work queued ahead of it.

    RDAPSweep:
      type: object
      description: |
        One scope's coverage by the RDAP rotation.

        There is no `next_check_at` counterpart to `DNSSweep`'s. The rotation
        re-verifies whichever verdict is oldest rather than working a stored
        schedule, so due-ness is derived from each name's last verdict against
        `rdap_rotation_days` — the same value the enclosing response reports,
        so the backlog and the window it was measured against cannot disagree.
      required:
        [total, checked, never_checked, due_now, registered, unregistered, unknown]
      properties:
        total:
          type: integer
          description: Every variant in scope, verified or not.
        checked:
          type: integer
          description: |
            Names with an RDAP verdict recorded at least once. A TLD
            publishing no RDAP server never becomes `checked` — nothing
            answered, which is the honest reading rather than a failure.
        never_checked: { type: integer }
        due_now:
          type: integer
          description: |
            Never-checked names plus those whose verdict is older than
            `rdap_rotation_days`. A rotation of `0` counts only the
            never-checked ones rather than sweeping the whole set into the
            backlog.
        registered:
          type: integer
          description: RDAP answered and says the name is taken.
        unregistered:
          type: integer
          description: RDAP answered and says nobody has the name.
        unknown:
          type: integer
          description: |
            No RDAP verdict is available. This is both "nothing has looked
            yet" and "this TLD publishes no RDAP service", which is why it is
            read next to `never_checked` rather than instead of it — see
            `Variant.registration`.
        first_checked_at:
          type: [string, "null"]
          format: date-time
          description: |
            Oldest verdict in scope; null when nothing has been verified. A
            rotation that is keeping up holds this no older than
            `rdap_rotation_days`.
        last_checked_at:
          type: [string, "null"]
          format: date-time

    ScanDomainStatus:
      type: object
      description: One watched domain's row on the scan-tracking page.
      required: [domain_id, domain, dns, rdap]
      properties:
        domain_id: { type: integer, format: int64 }
        domain: { type: string }
        variant_set_id:
          type: [integer, "null"]
          format: int64
          description: |
            The active set being swept, null for a domain whose generation has
            not produced one yet. That null is what distinguishes "nothing to
            sweep" from a set of zero scanned variants, which is "swept
            nothing yet" — the two render as identical zeroes otherwise.
        dns: { $ref: "#/components/schemas/DNSSweep" }
        rdap: { $ref: "#/components/schemas/RDAPSweep" }

    ScanStatus:
      type: object
      required:
        [enabled, interval_seconds, dns_qps, rdap_qps, rdap_rotation_days,
         resolvers, dns, rdap, domains, generated_at]
      properties:
        enabled:
          type: boolean
          description: |
            The live `scan_enabled` setting (PUT /api/v1/settings/variants).
            Without it every zero below is ambiguous between a backlog that
            will drain on its own and a sweep somebody switched off, which are
            opposite operator actions.
        interval_seconds:
          type: integer
          description: "`scan_interval_seconds`: how often each variant gets its DNS probe."
        dns_qps:
          type: number
          description: "`scan_dns_qps`: the ceiling draining the DNS backlog."
        rdap_qps:
          type: number
          description: "`scan_rdap_qps`: the ceiling draining the RDAP backlog."
        rdap_rotation_days:
          type: integer
          description: |
            `scan_rdap_rotation_days`: the window `rdap.due_now` was measured
            against, echoed here so the backlog is never reported without it.
        resolvers:
          type: array
          items: { type: string }
          description: |
            `scan_resolvers` — the resolvers the sweep queries. Empty means
            the host's own.
        dns:
          allOf: [{ $ref: "#/components/schemas/DNSSweep" }]
          description: Fleet-wide, the arithmetic sum of `domains[].dns`.
        rdap:
          allOf: [{ $ref: "#/components/schemas/RDAPSweep" }]
          description: Fleet-wide, the arithmetic sum of `domains[].rdap`.
        domains:
          type: array
          items: { $ref: "#/components/schemas/ScanDomainStatus" }
          description: |
            One row per live watched domain, ordered by name — including a
            domain with no active set, which renders as a zeroed row rather
            than being omitted.
        generated_at: { type: string, format: date-time }

    VariantListResponse:
      type: object
      description: |
        One page of lookalikes, plus the sweep progress for the whole set
        they came from. Shared by every variant list so the three cannot
        drift apart.
      required: [variants, scan]
      properties:
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        next_cursor: { type: [string, "null"] }
        next:
          type: [string, "null"]
          description: |
            The full request path + query string for the next page — this
            request's own filters, plus `cursor`. Null when there is no next
            page.
        total:
          type: integer
          description: Row count matching the current filters, independent of cursor/limit/page.
        scan:
          allOf: [{ $ref: "#/components/schemas/VariantScanProgress" }]
          description: |
            Sweep progress for the whole set, unfiltered. Always an object,
            never null.

    VariantChange:
      type: object
      properties:
        id: { type: integer, format: int64 }
        change:
          type: string
          enum:
            [
              became_registered,
              became_unregistered,
              registration_unknown,
              gained_ns,
              lost_ns,
              began_resolving,
              stopped_resolving,
              gained_mx,
              lost_mx,
              mx_changed,
              addresses_changed,
            ]
          description: |
            What moved. One row per transition, never per scan.
            `addresses_changed` is a lookalike that kept resolving but moved:
            crossing zero is `began_resolving`/`stopped_resolving` instead,
            and those carry the addresses in their payload, so one
            observation never writes two rows.
        observed_at: { type: string, format: date-time }
        fqdn: { type: string, description: The lookalike this transition is about. }
        variant: { type: string, description: Link to the variant's own detail. }
        previous:
          type: object
          additionalProperties: true
          description: The tracked fields as they were before the transition.
        current:
          type: object
          additionalProperties: true
          description: The tracked fields as they are after it.
        alerted:
          type: boolean
          description: |
            Whether this transition produced an alert. Only arrival at a
            status meaning a delegated name someone owns, or MX records
            appearing, wakes anybody; everything else is recorded and silent.
        _self: { type: string }

    VariantSet:
      type: object
      properties:
        id: { type: integer, format: int64 }
        generator: { type: string }
        generator_version: { type: string }
        config_hash: { type: string }
        algorithms: { type: array, items: { type: string } }
        tlds: { type: array, items: { type: string } }
        dictionary: { type: array, items: { type: string } }
        variant_count: { type: integer }
        truncated: { type: boolean }
        is_active: { type: boolean }
        generated_at: { type: string, format: date-time }
        watched_domain:
          allOf: [{ $ref: "#/components/schemas/Domain" }]
          description: |
            The watched domain this set was generated for — a direct FK
            (generation runs are always per-domain), present on every
            variant set so GET /variant-sets/{id} can link straight back to
            /domains/{id} instead of forcing an N+1 fetch.
        _self:
          type: string
          description: GET this for the variant set's own detail — see GET /variant-sets/{id}.

    VariantPreviewRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          description: |
            The domain to preview generation for. Not scoped to an existing
            watched domain — an operator previews before deciding to watch a
            domain at all, or before widening an existing one's TLD list.
        algorithms:
          type: array
          items: { type: string }
          description: Overrides variants.default_tlds' companion algorithm list for this preview only. Omitted, falls back to the full dnstwist fuzzer set.
        tlds:
          type: array
          items: { type: string }
          description: Overrides variants.default_tlds for this preview only. Omitted, falls back to the configured default.
        dictionary:
          type: array
          items: { type: string }
          description: Overrides variants.default_dictionary for this preview only. Omitted, falls back to the configured default.
        max_variants:
          type: integer
          minimum: 1
          description: Overrides variants.max_per_domain for this preview only. Omitted, falls back to the configured default.

    VariantPreviewResult:
      type: object
      description: |
        What a real generation run against these parameters would produce —
        nothing is persisted: no VariantSet is created, no Job is started.
        See POST /domains/{id}/variants/regenerate to commit to a run with
        the same overrides.
      properties:
        domain: { type: string }
        variant_count: { type: integer }
        truncated: { type: boolean }
        generator: { type: string }
        generator_version: { type: string }
        algorithms:
          type: array
          items: { type: string }
          description: The algorithm list actually used, after resolving overrides against configured defaults.
        tlds:
          type: array
          items: { type: string }
          description: The TLD list actually used, after resolving overrides against configured defaults.
        dictionary:
          type: array
          items: { type: string }
          description: The dictionary actually used, after resolving overrides against configured defaults.
        max_variants: { type: integer }

    RiskComponent:
      type: object
      properties:
        signal: { type: string }
        delta: { type: integer }
        reason: { type: string }

    Match:
      type: object
      properties:
        id: { type: integer, format: int64 }
        match_type: { type: string, enum: [exact, variant] }
        matched_name:
          type: string
          description: The observed SAN, not the watch entry.
        severity: { $ref: "#/components/schemas/Severity" }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        risk_components:
          type: array
          items: { $ref: "#/components/schemas/RiskComponent" }
          description: |
            The full derivation of risk_score. Stored so the UI can show its
            work and so weights can be retuned without losing the ability to
            explain historical alerts.
        issuer_expected: { type: [boolean, "null"] }
        certificate: { $ref: "#/components/schemas/Certificate" }
        watched_domain:
          allOf: [{ $ref: "#/components/schemas/Domain" }]
          description: |
            The watched domain this match belongs to. Present on every match,
            exact and variant alike — without it the triage table cannot say
            "lookalike of example.com" without an N+1 fetch per row.
        variant:
          oneOf:
            - $ref: "#/components/schemas/Variant"
            - type: "null"
          description: |
            The generated lookalike that matched, or null for an exact match.
            Carries the algorithm that produced it, which feeds both the risk
            score and the analyst's read of how deliberate the lookalike is.
        acknowledged_at: { type: [string, "null"], format: date-time }
        acknowledged_by: { type: string }
        created_at: { type: string, format: date-time }
        _self: { type: string, description: "GET this for the match's own detail — see GET /matches/{id}." }

    Certificate:
      type: object
      properties:
        sha256:
          type: string
          description: |
            Hex fingerprint, and the deduplication key. Deliberately not the
            serial: a CA's serial is unique only within that CA, so two issuers
            can collide and falsely merge unrelated certificates.
        tbs_sha256:
          type: [string, "null"]
          description: |
            Hex of the TBSCertificate hash. Identical for a precertificate and
            its final certificate — only the poison/SCT-list extension differs
            between them — so it pairs the two rows CT logging produces for
            one issuance (see GET /matches's merge_tbs_sha256). Null when the
            observation source never provided it.
        discovered_by:
          type: string
          description: |
            The ingest plugin that first observed this certificate — e.g.
            certspotter, certstream, sslmate-backfill (see GET /plugins for
            the full set currently configured). Set once, from whichever
            plugin's sighting created this row; a later sighting of the same
            certificate from a different plugin never changes it. Absent for
            certificates persisted before this field existed.
        serial_hex: { type: string }
        issuer_dn: { type: string }
        issuer_org: { type: string }
        subject_dn: { type: string }
        dns_names: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        is_precert:
          type: boolean
          description: |
            Whether this row is the precertificate half of the issuance. Read
            off the certificate's own RFC 6962 poison extension wherever the
            DER was available to the plugin that reported it; inferred from
            the tbs_sha256 sibling only when it was not, which is the
            certspotter-with-retention-off case. A precertificate and its
            final certificate are two rows sharing one `tbs_sha256` — see
            `merge_tbs_sha256` on GET /matches, which collapses the pair into
            one finding.
        first_seen_at: { type: string, format: date-time }
        pem_url:
          type: string
          description: "GET this for the certificate as PEM — see GET /certificates/{sha256}/pem. Constructed from sha256; not itself a guarantee the certificate is retained (retention off still 404s)."

    AllowlistEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fqdn: { type: string }
        reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        _self:
          type: string
          description: "GET this for the entry's own detail — see GET /allowlist/{id}."

    AllowlistEntryCreate:
      type: object
      required: [fqdn]
      properties:
        fqdn:
          type: string
          minLength: 1
          format: idn-hostname
          description: The registrable domain (eTLD+1) to stop alerting on — see internal/match's Snapshot.allowlisted.
        reason:
          type: [string, "null"]
          pattern: "^[^\\u0000]*$"
          description: Why this is benign. Unexplained allowlist entries are indistinguishable from mistakes six months later.

    NotificationChannel:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url_redacted:
          type: string
          description: Always "***" — never the channel's actual URL. See docs/OPERATIONS.md's key-management section.
        kind:
          type: string
          enum: [slack, discord, smtp, webhook, unknown]
          description: |
            A non-secret label derived from url's scheme when the channel
            was created or its URL last changed (internal/notify.ChannelKind)
            — never by decrypting the stored URL on read, which would turn a
            lost/misconfigured MERKLEYE_ENCRYPTION_KEY into an outage for
            listing channels at all, the same reason url_redacted is a fixed
            placeholder rather than scheme-revealing. Lets a list/detail UI
            label and icon a channel without ever seeing its secret.
        min_severity: { type: string, enum: [info, medium, high, critical] }
        template: { type: string }
        mode:
          type: string
          enum: ["", digest]
          description: Empty means immediate delivery.
        digest_at:
          type: string
          description: "HH:MM, local, when mode=digest."
        enabled: { type: boolean }
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When a message last actually delivered through this channel.
            Never null for a channel written through this API: POST, and any
            PATCH carrying a `url`, deliver a verification message first and
            store nothing if it fails, so the timestamp is always at least as
            recent as the secret it vouches for. POST
            /api/v1/notifications/test refreshes it. Null marks a row that
            predates the requirement or was written straight to the database
            — an alert path nobody has proven.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        _self:
          type: string
          description: "GET this for the channel's own detail — see GET /notification-channels/{id}."

    NotificationChannelCreate:
      type: object
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, pattern: "^[^\\u0000]*[^\\u0000\\s][^\\u0000]*$" }
        url:
          type: string
          minLength: 1
          oneOf:
            # slack/discord: the whole credential is the userinfo username —
            # a ':' in it means the token got split, which is the error
            # validateTokenChannel exists to catch — and the channel is the
            # host. A trailing path, query or fragment is allowed because
            # buildSlack ignores all three and such a channel does deliver.
            - pattern: "^(slack|discord)://[A-Za-z0-9._~!$&'()*+,;=-]+@[A-Za-z0-9.-]+(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?(\\?[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?(#[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?$"
            # smtp needs an explicit port (net/smtp dials host:port) plus from
            # and to; the two orders are spelled out because a regex cannot
            # say "contains both, either way round".
            - pattern: "^smtp://([A-Za-z0-9._~!$&'()*+,;=-]+(:[A-Za-z0-9._~!$&'()*+,;=-]*)?@)?[A-Za-z0-9.-]+:[0-9]{1,5}/?\\?([A-Za-z0-9._~=&+-]*&)?from=[A-Za-z0-9._~+-]+&([A-Za-z0-9._~=&+-]*&)?to=[A-Za-z0-9._~+-]+(&[A-Za-z0-9._~=&+-]*)?$"
            - pattern: "^smtp://([A-Za-z0-9._~!$&'()*+,;=-]+(:[A-Za-z0-9._~!$&'()*+,;=-]*)?@)?[A-Za-z0-9.-]+:[0-9]{1,5}/?\\?([A-Za-z0-9._~=&+-]*&)?to=[A-Za-z0-9._~+-]+&([A-Za-z0-9._~=&+-]*&)?from=[A-Za-z0-9._~+-]+(&[A-Za-z0-9._~=&+-]*)?$"
            # generic+http(s) needs only a host — buildHTTP will construct a
            # request for a host-less URL and fail at send time instead.
            - pattern: "^generic\\+https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?(\\?[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?(#[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?$"
          description: |
            Scheme-routed onto nikoksr/notify (internal/notify/sender.go):
            slack://<bot-token>@<channel-id>, discord://<bot-token>@<channel-id>,
            smtp://[<user>:<pass>@]<host>:<port>/?from=<addr>&to=<addr>[,<addr>...],
            or generic+http(s)://<host>/<path>. Encrypted before it reaches
            Postgres; never returned by any read. 

            Surrounding whitespace is trimmed and the URL is checked for the
            shape its scheme's client can use before anything is sent, so a
            malformed one is a 400 naming the fault rather than a failed
            delivery. For slack:// and discord:// the entire bot token is the
            userinfo *user* — a token containing ':' is rejected, because URL
            syntax would split it into a user and a password and only the
            part before the ':' would ever reach the API. smtp:// is the
            exception, where the userinfo password is the SMTP password, and
            it needs an explicit port. Nothing here constrains the token's
            own format: the vendor clients don't, so neither does this.

            Verified before it is stored: the server delivers a message
            through this URL and creates the channel only if it arrives (502
            otherwise, with nothing persisted). There is no way to opt out —
            a URL that cannot deliver now could not deliver an alert either.
        min_severity: { type: [string, "null"], enum: [info, medium, high, critical], default: high }
        template: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
        mode: { type: [string, "null"], enum: ["", digest] }
        digest_at: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
        enabled: { type: [boolean, "null"], default: true }

    NotificationChannelPatch:
      type: object
      description: |
        Every field optional — an absent field leaves it unchanged. Omitting
        `url` leaves the encrypted secret untouched, and is also what makes a
        patch silent: only a patch that carries `url` is a credential write,
        and only that one has to prove delivery first.
      properties:
        name: { type: string, minLength: 1, pattern: "^[^\\u0000]*[^\\u0000\\s][^\\u0000]*$" }
        url:
          type: string
          minLength: 1
          oneOf:
            # slack/discord: the whole credential is the userinfo username —
            # a ':' in it means the token got split, which is the error
            # validateTokenChannel exists to catch — and the channel is the
            # host. A trailing path, query or fragment is allowed because
            # buildSlack ignores all three and such a channel does deliver.
            - pattern: "^(slack|discord)://[A-Za-z0-9._~!$&'()*+,;=-]+@[A-Za-z0-9.-]+(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?(\\?[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?(#[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?$"
            # smtp needs an explicit port (net/smtp dials host:port) plus from
            # and to; the two orders are spelled out because a regex cannot
            # say "contains both, either way round".
            - pattern: "^smtp://([A-Za-z0-9._~!$&'()*+,;=-]+(:[A-Za-z0-9._~!$&'()*+,;=-]*)?@)?[A-Za-z0-9.-]+:[0-9]{1,5}/?\\?([A-Za-z0-9._~=&+-]*&)?from=[A-Za-z0-9._~+-]+&([A-Za-z0-9._~=&+-]*&)?to=[A-Za-z0-9._~+-]+(&[A-Za-z0-9._~=&+-]*)?$"
            - pattern: "^smtp://([A-Za-z0-9._~!$&'()*+,;=-]+(:[A-Za-z0-9._~!$&'()*+,;=-]*)?@)?[A-Za-z0-9.-]+:[0-9]{1,5}/?\\?([A-Za-z0-9._~=&+-]*&)?to=[A-Za-z0-9._~+-]+&([A-Za-z0-9._~=&+-]*&)?from=[A-Za-z0-9._~+-]+(&[A-Za-z0-9._~=&+-]*)?$"
            # generic+http(s) needs only a host — buildHTTP will construct a
            # request for a host-less URL and fail at send time instead.
            - pattern: "^generic\\+https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~!$&'()*+,;=:@/-]*)?(\\?[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?(#[A-Za-z0-9._~!$&'()*+,;=:@/?-]*)?$"
          description: |
            A new credential, so it is verified exactly like a create: the
            server delivers a message through it and applies the patch only
            if it arrives (502 otherwise, with the channel left unchanged).
            Every other field here changes body context only and sends
            nothing.
        min_severity: { type: [string, "null"], enum: [info, medium, high, critical] }
        template: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
        mode: { type: [string, "null"], enum: ["", digest] }
        digest_at: { type: [string, "null"], pattern: "^[^\\u0000]*$" }
        enabled: { type: [boolean, "null"] }

    NotificationTestRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            Delivers through this channel's own decrypted URL regardless of
            its `enabled` state, so an operator can verify a channel before
            switching it on, not only after.
        title:
          type: [string, "null"]
          description: Defaults to a canned message identifying Merkleye and the channel under test if omitted.
        body:
          type: [string, "null"]
          description: Defaults to a canned message identifying Merkleye and the channel under test if omitted.

    NotificationSettings:
      type: object
      properties:
        dedup_window:
          type: string
          description: Go duration string, e.g. "24h". Collapses the 2-6 log sightings of a single issuance into one alert.
        rate_limit_per_channel_per_minute: { type: integer }
        rate_limit_burst: { type: integer }
        retry_max_attempts: { type: integer }
        updated_at: { type: string, format: date-time, nullable: true }
        _self: { type: string }

    NotificationSettingsWrite:
      type: object
      required: [dedup_window, rate_limit_per_channel_per_minute, rate_limit_burst, retry_max_attempts]
      properties:
        dedup_window:
          type: string
          pattern: "^0*[1-9][0-9]{0,5}(ns|us|ms|s|m|h)([0-9]{1,6}(ns|us|ms|s|m|h))?$"
          description: 'Positive Go duration string, e.g. "24h".'
        rate_limit_per_channel_per_minute: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        rate_limit_burst: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        retry_max_attempts: { type: integer, minimum: 1, maximum: 9223372036854775807 }

    PluginStatus:
      type: object
      properties:
        ingestion_watchdog_tripped: { type: boolean }
        next_cursor:
          type: "null"
          description: The registered plugin set is fixed at compile time and small, so there is never a next page.
        next: { type: "null" }
        watch_set:
          type: object
          description: The same three counts, with the same meanings, as Summary.watch_set — including `allowlisted` counting allowlist entries rather than the matcher's suppression keys.
          properties:
            domains: { type: integer }
            variants: { type: integer }
            allowlisted: { type: integer }
        plugins:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              enabled: { type: boolean }
              pre_filtered:
                type: boolean
                description: |
                  Whether the plugin applied the watchlist before reporting.
                  Informational — the matcher runs downstream either way, so
                  filtered and unfiltered sources classify identically.
              last_observation_at: { type: [string, "null"], format: date-time }
              last_success_at: { type: [string, "null"], format: date-time }
              lag_seconds: { type: number }
              observations_total: { type: integer, format: int64 }
              last_error: { type: string }
              upstream: { $ref: "#/components/schemas/PluginUpstreamHealth" }
              _self: { type: string, description: "GET this for the plugin's own detail — see PluginDetail." }
              logs:
                type: array
                description: Per-log identity and last checkpoint. Absent for plugins with no per-log concept (certstream, the SSLMate backfill).
                items:
                  type: object
                  properties:
                    log_id: { type: string }
                    url: { type: string, description: Empty when the log couldn't be resolved to a human name. }
                    checkpoint_at: { type: [string, "null"], format: date-time }
                    _self:
                      type: string
                      description: GET this for the log's full detail — see PluginLogDetail.

    PluginDetail:
      type: object
      description: |
        The same fields as one PluginStatus.plugins[] entry, plus each log's
        full checkpoint state.
      properties:
        name: { type: string }
        enabled: { type: boolean }
        pre_filtered: { type: boolean }
        last_observation_at: { type: [string, "null"], format: date-time }
        last_success_at: { type: [string, "null"], format: date-time }
        lag_seconds: { type: number }
        observations_total: { type: integer, format: int64 }
        last_error: { type: string }
        upstream: { $ref: "#/components/schemas/PluginUpstreamHealth" }
        _self: { type: string }
        logs:
          type: array
          items: { $ref: "#/components/schemas/PluginLogDetail" }

    PluginUpstreamHealth:
      type: object
      description: |
        A sidecar's own self-report, as the plugin last read it. Present only
        for a plugin that has a sidecar to ask and a source that publishes a
        health endpoint — certstream against a self-hosted
        certstream-server-rust today, never against calidog.io's public feed.

        This is not a copy of the sidecar's metrics: those stay on the
        sidecar's own /metrics endpoint, scraped directly, so that reading
        them does not depend on Merkleye being up (docs/OBSERVABILITY.md).
        What is here is the one thing this side of the stream cannot infer —
        how many of the CT logs the sidecar tails are healthy. `lag_seconds`
        on the plugin itself stays the signal to alert on, because it
        measures what Merkleye actually received; this says why that lag
        looks the way it does.
      properties:
        status:
          type: string
          description: The upstream's own verdict, verbatim (e.g. "healthy", "degraded"). Not re-derived here — the thresholds behind it are the sidecar's to define.
        logs_healthy: { type: integer }
        logs_degraded: { type: integer }
        logs_unhealthy: { type: integer }
        logs_total: { type: integer }
        active_connections:
          type: integer
          description: |
            Connected clients as the sidecar counts them. Verified against
            certstream-server-rust 1.5.6: this does **not** include SSE
            subscribers, so it reads 0 while Merkleye is streaming happily —
            the sidecar's own `certstream_sse_connections` metric is the one
            that counts those. Do not read 0 here as "nothing is consuming
            the feed"; `observations_total` on the plugin is that answer.
        uptime_seconds: { type: number, description: Seconds since the sidecar last restarted. }
        checked_at:
          type: [string, "null"]
          format: date-time
          description: |
            The last *successful* read, so every count above carries its own
            age. Null when the endpoint has never answered.
        last_error:
          type: string
          description: |
            Why the most recent poll failed. The counts above are then the
            last good ones rather than zeros: an unreachable sidecar is not a
            sidecar reporting zero healthy logs.
        last_error_at: { type: [string, "null"], format: date-time }

    PluginLogDetail:
      type: object
      properties:
        log_id: { type: string }
        url: { type: string }
        description: { type: string }
        checkpoint_size:
          type: integer
          format: int64
          description: Entries verified against a signed tree head.
        checkpoint_at: { type: [string, "null"], format: date-time }
        checkpoint_age:
          type: string
          pattern: "^[0-9]{2,}:[0-9]{2}:[0-9]{2}$"
          description: Elapsed time since checkpoint_at, as HH:MM:SS. Hours are not capped at 24. Absent when checkpoint_at is null.
        download_size:
          type: integer
          format: int64
          description: Entries fetched but not yet verified.
        backlog:
          type: integer
          format: int64
          description: download_size - checkpoint_size — real lag between "we have the bytes" and "we trust the position".
        last_error: { type: string }
        last_error_at: { type: [string, "null"], format: date-time }
        _self: { type: string }

    PluginConfig:
      type: object
      properties:
        plugin: { type: string }
        configured:
          type: boolean
          description: Whether an admin has ever written a DB override for this plugin. False means enabled/source/url below reflect config.yaml's own values, not a stored row.
        enabled: { type: boolean }
        source:
          type: string
          enum: [self_hosted, calidog_public]
          description: self_hosted is an operator-run certstream-server-rust sidecar; calidog_public is the free hosted feed — guarded, not recommended for production (see GET /plugins/{id}/config's description).
        url: { type: string }
        auth_token_set:
          type: boolean
          description: Whether a bearer token is currently stored. The token itself is never returned once written.
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: string }
        applied_live:
          type: boolean
          description: Whether the running plugin process is actually using these settings, as opposed to config.yaml's own values.
        _self: { type: string }

    PluginConfigWrite:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        source:
          type: [string, "null"]
          enum: [self_hosted, calidog_public]
          default: self_hosted
        url:
          type: [string, "null"]
          description: SSE (http/https) or WebSocket (ws/wss) endpoint. Empty uses the plugin's built-in default for source.
        auth_token:
          type: [string, "null"]
          description: Omit to leave any already-stored token untouched; an explicit empty string clears it.
