            - { type: string, maxLength: 0 }
    get:
      tags: [domains, findings]
      operationId: listDomainMatches
      summary: List matches recorded against one watched domain
      description: |
        `cursor` is the `id` of the last item on the previous page — the
        response's `next_cursor` is meant to be passed straight back in, not
        constructed by the caller. id, not created_at: several matches can
        share a created_at down to the second, which would let a timestamp
        cursor skip or repeat rows. `order` and any filters used to fetch
        page 1 must be resent on later pages: the cursor alone does not carry
        them — except through `next`, which is the same request re-encoded
        with `cursor` set to the new value, so a client can just fetch it
        directly instead of reconstructing its own filters. All filters
        combine with AND.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/Match" }
                  next_cursor: { type: [string, "null"] }
                  next:
                    type: [string, "null"]
                    description: |
                      The full request path + query string for the next page —
                      this request's own filters and order, plus `cursor`.
                      Null when there is no next page.
                  total:
                    type: integer
                    description: |
                      Row count matching the current filters, independent of
                      cursor/limit/page and of merge_tbs_sha256/
                      collapse_cert_sans — this always counts raw match
                      rows, even when the list above was collapsed for
                      display. A pager computed as `ceil(total / limit)`
                      therefore over-counts the pages that exist once a
                      collapse is in effect (the common case, since
                      collapse_cert_sans defaults to true): use total_merged
                      instead whenever either collapse is on.
                  total_merged:
                    type: integer
                    description: |
                      Present whenever collapse_cert_sans and/or
                      merge_tbs_sha256 is in effect — which is by default,
                      since collapse_cert_sans defaults to true: the row
                      count after collapsing, computed across every matching
                      row rather than just this page. The collapse runs
                      before the page is cut, so this is the count the pages
                      are cut from: `ceil(total_merged / limit)` is the page
                      count to render, and each page holds up to `limit`
                      rows the way an uncollapsed one does.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/matches/rescore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [domains, findings]
      operationId: rescoreDomainMatches
      summary: Backfill risk_score/risk_components for one domain's exact matches
      description: |
        Recomputes `risk_score`/`risk_components` for every exact match on
        this watched domain, from each match's own already-stored
        classification (severity, issuer_expected, certificate issuer) —
        never by re-evaluating current policy, so it can't reclassify a match
        against `expected_issuers`/`max_validity_days` values that changed
        since it was recorded. Variant matches are untouched: they are always
        scored inline at ingestion time. Idempotent — safe to call repeatedly.
