openapi: 3.1.0

# This spec is the product boundary. merkleye-ui consumes this and nothing else
# — it generates its client from this file in CI and fails the build on drift.
# That discipline is what makes the two-repo split enforce a contract rather
# than just add friction. Published as a release artifact on every tagged
# release, not merely committed, so integrators always have a fetchable
# versioned contract. See DESIGN §11.

info:
  title: Merkleye API
  version: 0.1.0
  description: |
    Certificate Transparency watchtower.

    **Write authority.** Domains, issuer policies, the allowlist, variant
    generator settings, scoring thresholds, and notification
    channels/settings are all Postgres-owned and fully API-writable, with
    no config.yaml counterpart. Match triage (acknowledge,
    allowlist-from-match) is fully API-driven too. Every route — read and
    write — works today. See DESIGN §13.

    **Timestamps.** Every timestamp in every request and response is RFC 3339,
    UTC, Z-suffixed (`2026-08-19T02:07:00Z`). Never a Unix epoch, never a
    local-time string.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local deployment

security:
  - bearerToken: []
  - cookieAuth: []

tags:
  - name: auth
  - name: domains
  - name: variants
  - name: findings
  - name: allowlist
  - name: notifications
  - name: settings
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        "200":
          description: Process is up. May still report a tripped ingestion watchdog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [ops]
      operationId: getReadiness
      summary: Readiness
      description: |
        Returns 503 when the ingestion watchdog is tripped. A tripped watchdog
        means ingestion itself has gone silent, so Merkleye is not actually
        watching anything — reporting ready in that state would be a lie.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Ingestion stalled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      tags: [ops]
      operationId: getMetrics
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain: {}

  /api/v1/domains:
    get:
      tags: [domains]
      operationId: listDomains
      summary: List watched domains
      description: |
        Keyset-paginated over domains matching `status` by `id`, ascending
        — the same way `/domains/{id}/matches` paginates matches: `cursor`
        is the `id` of the last item on the previous page, and `next` is
        this request re-encoded with `cursor` advanced.
      parameters:
        - name: status
          in: query
          description: |
            `live` (default): only non-deleted domains, this route's only
            behavior before this parameter existed. `deleted`: only
            soft-deleted domains — the only way to discover a deleted
            domain's `id` at all, since GET /domains/{id} stops returning
            it and no other route lists it. Needed before
            POST /domains/{id}/restore or DELETE /domains/{id}/purge can be
            called on a domain a client doesn't already have the id for
            (e.g. after a page reload, or in a different session, from the
            one that deleted it). `all`: both.
          schema: { type: string, enum: [live, deleted, all], default: live }
        - name: cursor
          in: query
          description: The `id` of the last item on the previous page (from `next_cursor`).
          schema:
            # An empty value means "no filter" — see the note on the
            # date filters. The integer form is what a caller sends.
            anyOf:
              - { type: integer, format: int64, minimum: -9223372036854775808, maximum: 9223372036854775807 }
              - { type: string, maxLength: 0 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - name: page
          in: query
          description: 1-based page number — an offset-based alternative to cursor. Wins over cursor if both are supplied. See total.
          schema:
            # An empty value means "no filter" — see the note on the
            # date filters. The integer form is what a caller sends.
            anyOf:
              - { type: integer, minimum: 1, maximum: 2147483647 }
              - { type: string, maxLength: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items: { $ref: "#/components/schemas/Domain" }
                  next_cursor: { type: [string, "null"] }
                  next:
                    type: [string, "null"]
                    description: |
                      The full request path + query string for the next page —
                      this request's own `limit`, plus `cursor`. Null when
                      there is no next page.
                  total:
                    type: integer
                    description: Row count matching the current filters, independent of cursor/limit/page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [domains]
      operationId: createDomain
      summary: Create a watched domain
      description: |
        The name must be free. It is unique across every row, deleted or not:
        a soft-deleted domain keeps its name until it is restored or purged,
        so re-adding one 409s with
        `https://merkleye.dev/problems/domain-name-held-by-deleted` naming the
        row that holds it, rather than silently creating a second domain whose
        namesake's matches and variant sets nothing can reach any more.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [domains]
      operationId: getDomain
      summary: Get a watched domain
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [domains]
      operationId: updateDomain
      summary: Update a watched domain
      description: Partial update — include_subdomains and/or enabled. Domain name and issuer policy are immutable here; see PUT .../policies for the latter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [domains]
      operationId: deleteDomain
      summary: Soft-delete a watched domain
      description: |
        Sets a deletion marker; the row and every match/variant/policy that
        references it are untouched, and GET simply stops returning it.
        Reversible via POST .../restore. See DELETE .../purge for the
        permanent version.

        The domain keeps its name while deleted — POST /domains for that name
        409s until this row is restored or purged — so a name always has one
        row and one history.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [domains]
      operationId: restoreDomain
      summary: Restore a soft-deleted domain
      description: |
        Undoes DELETE /domains/{id}. 404 for a domain that is live (nothing
        to restore) or does not exist.

        Cannot conflict on the name: a soft-deleted domain holds its name for
        as long as it exists, so nothing can have taken it in the meantime.
        That collision surfaces at POST /domains instead, before a second row
        for the name could exist.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/purge:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [domains]
      operationId: purgeDomain
      summary: Permanently delete a watched domain
      description: |
        Unlike DELETE /domains/{id}, this is irreversible — and unlike that
        route, this one requires the domain to already be soft-deleted:
        calling this on a live domain 409s
        (domain-not-deleted) rather than deleting it in one step. Purge is
        only ever the second step of a two-step remove
        (DELETE /domains/{id} first, then this).

        It removes the domain's recorded history with it: its matches and
        any alerts queued for them, its variant sets with their variants
        and variant-change history, its issuer policies and its backfill
        jobs, all in one transaction. Certificates are shared across
        domains and are never deleted here. CT sightings are not deleted
        here either, but they are not kept indefinitely: they expire on
        their own retention window (`storage.observation_ttl`, 24h by
        default) regardless of which domains exist.
        Keeping the findings means stopping at DELETE /domains/{id}.

        409 (domain-still-referenced) is a backstop for a reference the
        cascade does not clear; when it fires nothing was deleted. See the
        Conflict response for both `type` values.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/policies:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [domains]
      operationId: getDomainIssuerPolicy
      summary: Get issuer policy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerPolicy" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [domains]
      operationId: replaceDomainIssuerPolicy
      summary: Replace issuer policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssuerPolicyWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/settings/variants:
    get:
      tags: [settings]
      operationId: getVariantSettings
      summary: Get variant-generation defaults
      description: |
        config.yaml's old `variants:` section — dnstwist generator URL and
        TLD/dictionary/max-per-domain defaults — now Postgres-owned. A PUT
        here reconfigures the running dnstwist client immediately, no
        restart required. See DESIGN §13.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      operationId: replaceVariantSettings
      summary: Replace variant-generation defaults
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantSettingsWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/settings/scoring:
    get:
      tags: [settings]
      operationId: getScoringSettings
      summary: Get severity thresholds
      description: |
        config.yaml's old `scoring.thresholds`, now Postgres-owned. A PUT
        here takes effect on the very next variant match — see
        internal/pipeline.Pipeline.classify. Weights
        (score.DefaultWeights/DefaultExactWeights) are not part of this and
        remain build defaults — see GET /docs/scoring.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      operationId: replaceScoringSettings
      summary: Replace severity thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringSettingsWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/caa:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: disallow_wildcard
        in: query
        description: |
          When true, adds an `issuewild ";"` record so no CA may issue a
          wildcard certificate for this domain, regardless of the issue
          records. Omitted (the default) leaves wildcard issuance governed
          by the same CAs as non-wildcard issuance, per RFC 8659's fallback
          from issuewild to issue.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean, default: false }
            - { type: string, maxLength: 0 }
      - name: iodef
        in: query
        description: |
          Adds an `iodef` record: a CA that must refuse an issuance request
          can report the attempt here. Must be a `mailto:` address or an
          `https://` URL.
        schema: { type: string, pattern: "^\\s*(mailto:|https://)\\S" }
      - name: cas
        in: query
        description: |
          Comma-separated CA identifiers (matched the same case-insensitive,
          substring way as expected_issuers, e.g. `Let's Encrypt,DigiCert`)
          to generate records for instead of the domain's expected_issuers.
          Does not modify the stored policy — a generation input for this
          request only, e.g. for previewing a CA set in the UI before
          deciding whether to persist it to config.yaml.
        schema: { type: string, pattern: "^[^\\u0000]*[^,\\u0000\\s][^\\u0000]*$" }
      - name: exclude_cas
        in: query
        description: |
          Comma-separated CA identifiers to drop from whichever list is in
          effect (expected_issuers, or `cas` if given) before generating
          records. The fast path for pulling a CA that turns out to be
          unauthorized — a compromised reseller account, a mis-issuing
          intermediate — out of the CAA policy immediately, without waiting
          on a config.yaml deploy to remove it from expected_issuers. An
          entry that doesn't match a known CA is reported in `warnings`
          rather than silently ignored.
        schema: { type: string, pattern: "^[^\\u0000]*[^,\\u0000\\s][^\\u0000]*$" }
    get:
      tags: [domains]
      operationId: getDomainCAA
      summary: Generate CAA records from the domain's issuer policy
      description: |
        Maps the domain's expected_issuers (internal/policy's own input,
        DESIGN G-04) onto the CAA `issue` hostnames those CAs publish, the
        same way sslmate.com/caa lets an operator build a CAA record set —
        except the CA list here is the one already governing this domain's
        alerting, not a hand-picked checklist. See internal/caa.

        `cas` overrides expected_issuers outright and `exclude_cas` drops
        specific CAs from whichever list is in effect; see their param
        descriptions above. Neither persists — both are generation inputs
        for this request only.

        An expected_issuers (or `cas`) entry that doesn't resolve to a known
        CA is never silently dropped: it's returned in `unmapped_issuers` and
        explained in `warnings`. If every entry is unmapped, or every matched
        CA is excluded via `exclude_cas`, `records` and `zone` come back
        empty rather than a record set containing only `issuewild`/`iodef` —
        publishing CAA records with no `issue` tag at all authorizes no CA to
        issue (RFC 8659 §5.3), which would lock out the CA actually serving
        the domain.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAAResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/dns-provider:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [domains]
      operationId: getDomainDNSProvider
      summary: Detect the domain's DNS host from its nameservers
      description: |
        A live NS lookup against the domain, matched against a curated table
        of major public DNS hosts (internal/dnsprovider) — the answer to
        "where do I paste the records GET .../caa just generated". Each
        matched provider carries only its own DNS management console's entry
        point, never a deep link into a specific account or zone: Merkleye
        holds no credential that would let it know which one is the
        operator's, so every link still requires login.

        A lookup failure is reported via `warnings` with empty
        `nameservers`/`providers` rather than an error status — the caller
        always gets a renderable response.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSProviderResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/cas:
    get:
      tags: [domains]
      operationId: listKnownCAs
      summary: List the CA catalog CAA generation resolves against
      description: |
        The global list of publicly-trusted CAs internal/caa.KnownCAs
        recognizes — what `expected_issuers`, and GET /domains/{id}/caa's own
        `cas`/`exclude_cas` params, resolve identifiers against to produce an
        `issue` hostname. Not domain-scoped and nothing here is per-domain
        state: the same catalog answers this for every domain, which is why
        a client can use it to build a reusable CA picker instead of
        free-typing names that may or may not match — see the unmapped-issuer
        note on GET /domains/{id}/caa for what happens when they don't.

        With `includeUserCAs=true` the stored catalog is merged in: CCADB's
        published CAA identifiers (a snapshot shipped in the binary and
        applied at boot, so it changes on release, not on a schedule) plus
        every CA an admin added through POST /api/v1/cas. That is a far more complete picker, and it is read from
        the database on every request, so a CA added a second ago is already
        here — no restart, no cache to wait out.

        Note what the two halves are for. Only `source: curated` entries
        participate in CAA record *generation*: `expected_issuers`, `cas` and
        `exclude_cas` resolve through internal/caa.LookupCA, which knows the
        curated list alone. A `ccadb` or `operator` entry is a catalog and
        picker entry — sending its name in `cas` today lands in
        `unmapped_issuers` rather than producing a record.

        Entries are deduplicated on `issue_hostname` with the curated entry
        winning, so a CA present in both renders once, under the reviewed
        name. Curated aliases (e.g. "GeoTrust" also resolving to DigiCert)
        are deliberately not exposed — they exist only so free-text
        `expected_issuers` entries match, not as additional selectable
        identities. Use `name` as the value to send back in `cas`/
        `exclude_cas`.
      parameters:
        - name: includeUserCAs
          in: query
          description: |
            Merge the stored catalog (CCADB-mirrored + operator-added CAs)
            into the response. Absent or false serves only the curated
            in-process list, which is exactly what this endpoint returned
            before the stored catalog existed. `include_user_cas` below is
            an accepted snake_case alias, matching every other query
            parameter in this API; this spelling wins if both are sent.
          schema:
            # An empty value means "no filter" — see the note on the
            # date filters. The boolean form is what a caller sends.
            anyOf:
              - { type: boolean, default: false }
              - { type: string, maxLength: 0 }
        - name: include_user_cas
          in: query
          description: |
            snake_case alias for `includeUserCAs`, which is the spelling the
            UI sends. Declared rather than merely described in prose because
            an undeclared query parameter is now rejected with 400 — a
            parameter the handler honours has to appear here or it stops
            working. See ADR-0060.
          schema:
            # An empty value means "no filter" — see the note on the
            # date filters. The boolean form is what a caller sends.
            anyOf:
              - { type: boolean, default: false }
              - { type: string, maxLength: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownCAsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [domains]
      operationId: createCA
      summary: Add a CA to the catalog
      description: |
        Registers a CA neither the curated list nor CCADB carries — a private
        PKI, an internal issuing hierarchy, or a CA newer than the last CCADB
        sync — so it becomes selectable wherever the catalog is offered
        (GET /api/v1/cas with `includeUserCAs=true`).

        Admin-scoped because this is global configuration rather than
        per-domain data: it changes every domain's CA picker, the same bar
        PUT /plugins/{id}/config sits behind.

        The row is always operator-owned (`system_managed: false`,
        `source: operator`) and there is no way to create a system-managed
        one — a row carrying that flag would be deleted by the next CCADB
        sync, which owns them. `identifier` must be a dotted ASCII hostname:
        it is published verbatim in a CAA `issue` record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/cas/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [domains]
      operationId: deleteCA
      summary: Remove an operator-added CA from the catalog
      description: |
        Permanent, and admin-scoped for the same reason POST /api/v1/cas is.

        Only CAs added through POST /api/v1/cas can be deleted. A
        CCADB-mirrored row (`system_managed: true`) is refused with 409: the
        catalog sync owns those rows and would recreate this one on its next
        run, so accepting the delete would report a success that silently
        undoes itself. Curated entries have no `id` at all and so cannot be
        addressed here.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: cursor, in: query, schema: { type: integer, format: int64 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      - { name: algorithm, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
      - { name: tld, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
      - name: registration
        in: query
        description: RDAP's verdict. `unknown` means no RDAP answer is available for the name, which is not the same as unregistered.
        schema: { type: string, enum: [registered, unregistered, unknown] }
      - name: registered
        in: query
        description: Boolean shorthand for `registration` — true selects `registered`, false selects `unregistered`. `registration` wins if both are given.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: q
        in: query
        description: Case-insensitive substring of the lookalike's own fqdn.
        schema: { type: string, pattern: "^[^\\u0000]*$" }
      - name: ns_resolves
        in: query
        description: Whether the name has nameservers delegated. Omit to not filter on it — `false` is a real answer, not the absence of one.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: resolves
        in: query
        description: Whether the name has an A or AAAA record. Omit to not filter on it — `false` is a real answer, not the absence of one.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: has_mx
        in: query
        description: |
          Whether the name publishes any MX host. Omit to not filter on it —
          `false` is a real answer ("probed, takes no mail"), and it also
          covers a variant nothing has scanned since the field existed, so
          the two values partition the set.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: page
        in: query
        description: 1-based page number — an offset-based alternative to cursor. Wins over cursor if both are supplied. See total.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The integer form is what a caller sends.
          anyOf:
            - { type: integer, minimum: 1, maximum: 2147483647 }
            - { type: string, maxLength: 0 }
    get:
      tags: [variants]
      operationId: listDomainVariants
      summary: List generated lookalikes
      description: |
        Reads the domain's current (active) VariantSet from Postgres,
        optionally filtered by algorithm, tld, and/or registration state.
        Registration and DNS state are refreshed on a schedule by the variant
        scanner rather than frozen at generation time — see `last_checked_at`
        on each variant, which is null for one nothing has scanned yet. A
        domain with no generation run yet, or one still in flight, renders as
        an empty list rather than an error.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantListResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/variants:
    parameters:
      - { name: cursor, in: query, schema: { type: integer, format: int64 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      - name: domain_id
        in: query
        description: Restrict to one watched domain's lookalikes — the same id as GET /domains/{id}. Omit for every watched domain at once.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The integer form is what a caller sends.
          anyOf:
            - { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
            - { type: string, maxLength: 0 }
      - { name: algorithm, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
      - { name: tld, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
      - name: q
        in: query
        description: Case-insensitive substring of the lookalike's own fqdn.
        schema: { type: string, pattern: "^[^\\u0000]*$" }
      - name: registration
        in: query
        description: RDAP's verdict. `unknown` means no RDAP answer is available for the name, which is not the same as unregistered.
        schema: { type: string, enum: [registered, unregistered, unknown] }
      - name: registered
        in: query
        description: Boolean shorthand for `registration` — true selects `registered`, false selects `unregistered`. `registration` wins if both are given.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: ns_resolves
        in: query
        description: |
          Whether the name has nameservers delegated. Omit to not filter on
          it — `false` is a real answer ("scanned, nothing delegated"), not
          the absence of one.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: resolves
        in: query
        description: Whether the name has an A or AAAA record. Omit to not filter on it — `false` is a real answer, not the absence of one.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: has_mx
        in: query
        description: |
          Whether the name publishes any MX host. Omit to not filter on it —
          `false` is a real answer ("probed, takes no mail"), and it also
          covers a variant nothing has scanned since the field existed, so
          the two values partition the set.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: page
        in: query
        description: 1-based page number — an offset-based alternative to cursor. Wins over cursor if both are supplied. See total.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The integer form is what a caller sends.
          anyOf:
            - { type: integer, minimum: 1, maximum: 2147483647 }
            - { type: string, maxLength: 0 }
    get:
      tags: [variants]
      operationId: listVariants
      summary: List generated lookalikes across every watched domain
      description: |
        GET /domains/{id}/variants with the domain scope lifted: every watched
        domain's current (active) VariantSet in one filterable, paged list.

        This is what makes the generated watch set answerable. A deployment
        watching a dozen domains generates five or six figures of lookalikes,
        and questions worth asking about them ("which registered ones resolve",
        "every `.zip` homoglyph anywhere") do not fit inside one domain — asked
        per domain they turn into a dozen paginated lists the caller has to
        merge by hand, with no honest `total` at the end of it.

        Deactivated variant sets are excluded, exactly as the per-domain list
        excludes them (DESIGN G-10): they are kept for provenance, and
        including them here would render a name that survived a regeneration
        once per generation it survived.

        `total` counts rows matching the filters, so a pager can render "page 7
        of 40" from the first response. Registration and DNS state are the
        variant scanner's latest, not generation-time — `last_checked_at` is
        null for a name nothing has scanned yet.

        Note what is not a filter here: `allowlisted` on each variant is
        derived from the live matcher snapshot rather than stored on the row
        (see the Variant schema), so it cannot be pushed into the query
        without making `total` disagree with the rows returned. Filter it
        client-side, or read GET /allowlist for the entries themselves.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/variants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [variants]
      operationId: getVariant
      summary: Variant detail
      description: |
        The target of every variant's `_self` link. A variant's own database
        ID is enough to look it up — it isn't scoped through a watched
        domain, mirroring GET /matches/{id}.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/variants/{id}/allowlist:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [variants]
      operationId: allowlistVariant
      summary: Mark a variant as not a threat
      description: |
        Suppresses this lookalike entirely: no certificate on it, or on any
        hostname under it, produces a match again. Use for a name you
        registered defensively, a real unrelated business, or a parked name
        you have already looked at.

        Broader than POST /matches/{id}/allowlist, which by default answers
        "this certificate is fine" and silences one hostname. This route
        writes the variant's registrable domain, so everything beneath it is
        covered.

        The judgement is stored as an allowlist entry (GET /allowlist), not
        as a flag on the variant, so it survives regeneration into a new
        variant set — see DESIGN G-09 and G-10. Already allowlisted returns
        200 with the standing entry rather than a conflict.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: |
                    Why this is benign. Unexplained allowlist entries are
                    indistinguishable from mistakes six months later.
      responses:
        "201":
          description: Allowlisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "200":
          description: Already allowlisted; the standing entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [variants]
      operationId: unallowlistVariant
      summary: Un-mark a variant as not a threat
      description: |
        Undo of the POST, addressed by the variant so a caller looking at
        one does not have to find which allowlist entry covers it. Removes
        only the entry for the variant's own name; a narrower hostname entry
        beneath it (written by POST /matches/{id}/allowlist) is a separate
        judgement and stays — use DELETE /allowlist/{id} for that.
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: No such variant, or it is not allowlisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/variant-changes:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: cursor, in: query, schema: { type: integer, format: int64 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    get:
      tags: [variants]
      operationId: listDomainVariantChanges
      summary: Variant state timeline
      description: |
        Every observed transition in the active set's variants, newest first:
        a lookalike becoming registered, acquiring nameservers, standing up
        MX records, or going dark again. Append-only and written only when
        something actually moved, so this is a timeline of changes rather
        than a scan log — a quiet sweep over a large set adds nothing here.

        Paginated backwards through ids (`cursor` is the oldest id already
        seen), since the interesting end of a timeline is the recent one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  variant_changes:
                    type: array
                    items: { $ref: "#/components/schemas/VariantChange" }
                  next_cursor: { type: [string, "null"] }
                  next:
                    type: [string, "null"]
                    description: The full request path + query string for the next page. Null when there is no next page.
                  total:
                    type: integer
                    description: Total transitions recorded for this domain's active set.
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/variants/regenerate:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: algorithms
        in: query
        description: |
          Comma-separated dnstwist fuzzers to run instead of the full default
          set, e.g. `homoglyph,cyrillic,tld-swap`. Each value must be one of
          the algorithms dnstwist supports; an unrecognized name is a 400,
          not a silently-empty result.
        schema: { type: string, pattern: "^[^\\u0000]*[^,\\u0000\\s][^\\u0000]*$" }
      - name: tlds
        in: query
        description: |
          Comma-separated TLDs to permute against instead of
          variants.default_tlds, e.g. `com,net,io`.
        schema: { type: string, pattern: "^[^\\u0000]*[^,\\u0000\\s][^\\u0000]*$" }
      - name: dictionary
        in: query
        description: |
          Comma-separated dictionary words fed to the `dictionary` fuzzer
          instead of variants.default_dictionary, e.g. `login,secure,verify`.
        schema: { type: string, pattern: "^[^\\u0000]*[^,\\u0000\\s][^\\u0000]*$" }
      - name: max_variants
        in: query
        description: |
          Overrides variants.max_per_domain for this run — the cap after
          which the sidecar reports the result as truncated.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The integer form is what a caller sends.
          anyOf:
            - { type: integer, minimum: 1, maximum: 9223372036854775807 }
            - { type: string, maxLength: 0 }
    post:
      tags: [variants]
      operationId: regenerateDomainVariants
      summary: Trigger a fresh generation run
      description: |
        A VariantSet is Postgres-owned operational state, same as domains,
        policies and the allowlist (DESIGN §13) — this has been a real write
        route from the start. Starts a new run
        immediately and returns without waiting for it — watch
        GET .../variants for the result. The new set becomes active,
        deactivating the prior one, only once the run completes; a run
        already in flight is shared rather than duplicated, and any
        algorithms/tlds/dictionary/max_variants overrides on this call are
        ignored in that case since the in-flight run already committed to
        the parameters that started it.

        algorithms/tlds/dictionary/max_variants each override the
        corresponding variants.* config default for this run only — omitting
        one falls back to config, it does not mean "use an empty list".
      responses:
        "202": { description: Generation started }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/backfill:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [domains]
      operationId: queueDomainBackfill
      summary: Re-queue a domain's SSLMate historical walk
      description: |
        Re-triggers the bounded backfill (DESIGN G-02) for one domain —
        useful after a config change, without restarting the process.

        This writes the durable job row, so the result is observable:
        the response body is the queued job at `state: pending`, and
        polling `GET /api/v1/domains/{id}/backfill` (or
        `GET /api/v1/backfill`) follows it to `running` and then `done`.

        A re-queue restarts the walk rather than resuming it: the paging
        cursor and attempt counter are cleared, because asking for a
        re-walk means the domain's whole history. Resuming a partially
        completed walk is what a lease reclaim does after an ungraceful
        shutdown, and it does not go through this route.

        Returns immediately; matching observations flow through the
        normal ingestion pipeline as the walk progresses.
      responses:
        "202":
          description: Backfill queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillJob" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplementedYet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [domains, ops]
      operationId: getDomainBackfill
      summary: One domain's backfill job and run history
      description: |
        `current` is the live job (pending, running or deferred) or null
        when no walk is scheduled. `history` is every run for this domain,
        newest first, including `current`.

        History exists because a single status field could never answer
        "has this ever worked, and when did it stop working" — the
        question an operator actually has when a walk looks stuck.

        Unpaginated and capped, the same as GET /allowlist and
        GET /plugins: one domain's walk history is small and code-bounded,
        not an unbounded operational log.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    oneOf:
                      - $ref: "#/components/schemas/BackfillJob"
                      - type: "null"
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/BackfillJob" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/backfill:
    get:
      tags: [domains, ops]
      operationId: getBackfillStatus
      summary: SSLMate backfill state and progress, across every watched domain
      description: |
        Every watched domain's historical walk, in one request: what state
        it is in, how far along it is, and when it next runs.

        Progress is the point. The SSLMate plugin's own aggregate health
        (`GET /plugins/sslmate-backfill`) cannot distinguish a multi-page
        walk in progress from a hung process, and a rate-limited domain's
        only other trace there is a transient `last_error` overwritten the
        moment any other domain fails or succeeds. Each row here carries
        `pages_done`, `issuances_seen`, `certs_emitted` and the paging
        cursor, so a walk that is working looks different from one that is
        not.

        States: `running` is being walked right now (`owner` holds the
        lease); `deferred` is rate-limited or backing off after a transient
        failure, with `next_run_at` giving the retry time; `failed` has
        stopped retrying and needs a human; `pending` is queued, and with a
        non-zero `pages_done` is a partially-completed walk waiting to
        resume from `after_cursor`. A domain with no job row yet renders as
        `pending` with zeroed counters.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/scan:
    get:
      tags: [variants, ops]
      operationId: getScanStatus
      summary: Variant scanning state — the DNS sweep and the RDAP rotation
      description: |
        Both halves of variant tracking in one request: how much of the
        generated lookalike set has been probed by DNS, how much has been
        verified against RDAP, how much of each is backlog right now, and the
        same three answers again per watched domain.

        **The two halves are reported separately on purpose.** They run on
        two different clocks against two different third parties and they
        stall independently — a resolver outage stops DNS while the RDAP
        rotation keeps turning, and a registry answering `429` stops RDAP
        while every name keeps being probed. A single blended "scan progress"
        figure would hide whichever one had stopped, which is the only thing
        this route exists to reveal.

        **`due_now` is the number that matters.** `last_scanned_at` alone
        cannot tell an idle sweep from a stuck one: both look stale. A stale
        timestamp with `due_now: 0` means there is nothing to do; the same
        timestamp with a large `due_now` means work is queued and not moving,
        and `enabled` says whether that is a switch somebody turned off.

        Scoped to *active* variant sets belonging to live watched domains,
        exactly as `GET /api/v1/variants` is (DESIGN G-10) — a deactivated set
        holds the names a regeneration carried forward, and counting it would
        inflate both halves of every ratio here. The fleet-wide `dns` and
        `rdap` objects are the arithmetic sum of the `domains` rows, so the
        headline and the table can never disagree.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/domains/{id}/variant-sets:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [variants]
      operationId: listDomainVariantSets
      summary: Variant set history
      description: |
        Every VariantSet ever generated for this domain, newest first. Sets
        are versioned and never deleted, only deactivated — so a match
        recorded months ago still resolves to the exact generator and config
        that produced its variant. See DESIGN G-10.

        Unpaginated: next_cursor and next are always null, the same as
        GET /allowlist and GET /plugins — one domain's regeneration history
        is small and code-bounded, not an unbounded operational log like
        matches or certificates (see DESIGN "Every resource carries
        _self...").
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  variant_sets:
                    type: array
                    items: { $ref: "#/components/schemas/VariantSet" }
                  next_cursor: { type: "null" }
                  next: { type: "null" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/variant-sets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [variants]
      operationId: getVariantSet
      summary: Variant set detail
      description: |
        The target of every variant set's `_self` link. A variant set's own
        database ID is enough to look it up — it isn't scoped through a
        watched domain, mirroring GET /variants/{id} and GET /matches/{id}.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/variant-sets/{id}/variants:
    parameters:
      - $ref: "#/components/parameters/Id"
      - { name: cursor, in: query, schema: { type: integer, format: int64 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      - { name: algorithm, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
      - { name: tld, in: query, schema: { type: string, pattern: "^[^\\u0000]*$" } }
      - name: registration
        in: query
        description: RDAP's verdict. `unknown` means no RDAP answer is available for the name, which is not the same as unregistered.
        schema: { type: string, enum: [registered, unregistered, unknown] }
      - name: registered
        in: query
        description: Boolean shorthand for `registration` — true selects `registered`, false selects `unregistered`. `registration` wins if both are given.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
            - { type: string, maxLength: 0 }
      - name: q
        in: query
        description: Case-insensitive substring of the lookalike's own fqdn.
        schema: { type: string, pattern: "^[^\\u0000]*$" }
      - name: ns_resolves
        in: query
