            - { type: string, maxLength: 0 }
      - name: resolves
        in: query
        description: Whether the name has an A or AAAA record. Omit to not filter on it — `false` is a real answer, not the absence of one.
        schema:
          # An empty value means "no filter" — see the note on the
          # date filters. The boolean form is what a caller sends.
          anyOf:
            - { type: boolean }
