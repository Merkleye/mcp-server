          items: { type: string, enum: [suppressed, info, medium, high, critical] }
      - { name: issuer_expected, in: query, schema: { type: boolean } }
      - { name: acknowledged, in: query, schema: { type: boolean } }
      - name: matched_name
        in: query
        description: Substring match (case-insensitive) against the observed SAN.
        schema: { type: string, pattern: "^[^\\u0000]*$" }
      - name: acknowledged_by
        in: query
        description: Substring match (case-insensitive).
        schema: { type: string, pattern: "^[^\\u0000]*$" }
      - name: risk_score_min
        in: query
        schema:
          # An empty value means "no filter"; the bounds are
          # strconv.ParseInt's, which is what reads this.
