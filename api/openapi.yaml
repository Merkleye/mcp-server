      - name: sha256
        in: query
        description: Exact match, 64 hex characters (either case).
        schema: { type: string, pattern: "^$|^[0-9a-fA-F]{64}$" }
      - name: dns_name
        in: query
        description: Exact match against one of the certificate's SANs.
        schema: { type: string, pattern: "^[^\\u0000]*$" }
