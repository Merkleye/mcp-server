name: CI

# This repository has no `main`: its default branch is
# claude/merkleyes-mcp-server-5wezpz, which is what every PR targets. The push
# trigger named `main` therefore never fired, so nothing had ever run outside a
# pull request. Watching the default branch by name via the built-in context
# keeps that true if the branch is ever renamed.
on:
  push:
    branches:
      - main
      - claude/merkleyes-mcp-server-5wezpz
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA, never a tag. A tag is mutable: the
# owner can repoint v4 at any commit, and every workflow tracking it runs new
# code with no diff and no review. The trailing comment records which release
# the SHA was, so Renovate can bump both together.
#
# MERKLEYE_BACKEND_TOKEN is required, not optional. merkleye's OpenAPI spec is
# private and deliberately not stored in this repository, so nothing here can
# generate the API client without a credential that can read merkleye/merkleye.
# The default GITHUB_TOKEN is scoped to this repository and will not do.
#
# It is an organization secret, shared by every Merkleye repo that needs to read
# the backend, and named for the access it grants rather than for what this repo
# does with it. If a job fails at the fetch step, check this repository is in the
# secret's access list.

jobs:
  check:
    name: Backend
    runs-on: ubuntu-latest
    # Job-level rather than per-step: `vet`, `test` and `lint` all depend on the
    # `generate` task, so any of them can be the one that needs to fetch the
    # spec. Scoping the token to a single step only works while an earlier step
    # happens to have cached the fetch first, which is a step-ordering
    # coincidence, not a guarantee.
    env:
      MERKLEYE_BACKEND_TOKEN: ${{ secrets.MERKLEYE_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pyyaml is for scripts/prepare-spec.py and the validation inside
      # scripts/fetch-spec.sh.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml

      # mise provisions the toolchain pinned in mise.toml, and CI runs the same
      # tasks a contributor runs locally — there is no second definition of
      # what "check" means.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.9.1
          install: true
          cache: true

      # Fetches the spec from the commit pinned in api/SPEC_VERSION, validates
      # it, then generates the client from it.
      - name: Generate the API client
        run: mise run generate

      - run: mise run fmt-check
      - run: mise run vet

      # Lint goes through the action rather than `mise run lint`. The
      # golangci-lint release pinned in mise.toml is itself built with an older
      # Go than this module targets and refuses to load it ("the Go language
      # version used to build golangci-lint is lower than the targeted Go
      # version"); the action fetches a build matching the runner's toolchain.
      # `mise run lint` stays for local use and starts working once the pinned
      # release catches up — see AGENTS.md.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          args: --timeout=5m

      - run: mise run test

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    env:
      MERKLEYE_BACKEND_TOKEN: ${{ secrets.MERKLEYE_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.9.1
          install: true
          cache: true
      - name: Check for known vulnerabilities
        run: mise run govulncheck

  build:
    name: Build image
    runs-on: ubuntu-latest
    env:
      MERKLEYE_BACKEND_TOKEN: ${{ secrets.MERKLEYE_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install pyyaml

      # The spec is fetched here rather than inside the build, so the token
      # never reaches the builder or any layer. The build stage consumes it and
      # the final image contains only the compiled binary.
      - name: Fetch the pinned OpenAPI spec
        run: ./scripts/fetch-spec.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Containerfile
          push: false
          platforms: linux/amd64
